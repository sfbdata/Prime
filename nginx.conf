server {
    listen 80;
    server_name localhost;

    root /var/www/app/public;
    index index.php index.html;

    client_max_body_size 70m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # C5 (defesa-em-profundidade): /uploads/ NUNCA é servido como arquivo estático.
    # Tudo cai no front controller — rota controlada com auth (ex.: imagens de peça),
    # ou 404. Espelha nginx.prod.conf. Sem isto, try_files $uri serviria o PII direto.
    location ^~ /uploads/ {
        rewrite ^ /index.php last;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }
}
