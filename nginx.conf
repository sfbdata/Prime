server {
    listen 80;
    server_name localhost;

    root /var/www/app/public;
    index index.php index.html;

    client_max_body_size 70m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # C5 (defesa-em-profundidade): /uploads/ NUNCA é servido como arquivo estático.
    # Tudo cai no front controller — rota controlada com auth (ex.: imagens de peça),
    # ou 404. Espelha nginx.prod.conf. Sem isto, try_files $uri serviria o PII direto.
    location ^~ /uploads/ {
        rewrite ^ /index.php last;
    }

    # Código (CSS/JS) revalida sempre via ETag — mantém dev e prod coerentes e evita o
    # falso negativo de smoke com JS servido do cache velho (espelha nginx.prod.conf).
    # Auditoria 4.01: a porta 8080 fica aberta na rede (decisão do dono), mas o profiler do Symfony mostra
    # segredos do .env, cookies e o corpo do POST de login. /_profiler e /_wdt só respondem a este computador:
    # 127.0.0.1 e o gateway da rede saas_net (o Docker entrega o acesso de localhost:8080 com esse IP de origem).
    # Quem vem de outra máquina chega com o próprio IP e recebe 403. try_files (e não rewrite) mantém o allow/deny
    # nesta location. Se a rede for recriada com outro gateway, o profiler dá 403 até ajustar o IP abaixo:
    # docker network inspect bluejus_saas_net -f '{{range .IPAM.Config}}{{.Gateway}}{{end}}'
    location ~ ^(/index\.php)?/(_profiler|_wdt)(/|$) {
        allow 127.0.0.1;
        allow 172.18.0.1;
        deny all;
        try_files $uri /index.php$is_args$args;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }
}
