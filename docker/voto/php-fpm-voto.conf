; Pool do PHP-FPM do container `voto` (BlueJus Voto, spec docs/specs/bluejus-voto.md, D2 item 1).
;
; Montado como /usr/local/etc/php-fpm.d/zz-voto.conf (docker-compose.prod.yml, serviço voto). O FPM lê os
; arquivos de php-fpm.d em ordem alfabética e o último valor de cada chave vence: este vem depois do www.conf, do
; zz-docker.conf e do zz-seguranca.conf, então só troca o tamanho do pool [www]; o resto (porta 9000,
; register_argc_argv desligado) continua como na imagem.
;
; O limite é do container do Voto: um pico de eleitores esgota estes processos, nunca os do php do BlueJus.
; NÚMEROS PROVISÓRIOS até o teste de carga (D2): 10 processos cabem nos 768 MB do container com folga para o
; cache:warmup e o opcache; reveja junto com o mem_limit e o CONNECTION LIMIT do voto_app (cada processo segura
; no máximo uma conexão com o banco).

[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; Sem log de acesso do FPM. A imagem manda o access.log do pool para o stderr com o formato padrão, que começa
; pelo IP do cliente (%R) e traz hora e endereço de cada requisição: isso desfaria o `access_log off` do nginx
; nas rotas de autorizar e urna (spec, seção 4, item 5). Erros do PHP seguem no stderr (docker logs).
access.log = /dev/null
