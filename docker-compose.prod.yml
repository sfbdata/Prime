services:
  php:
    build:
      context: .
      target: prod
      secrets:
        - composer_auth
    container_name: jusprime_php_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      APP_ENV: prod
      APP_DEBUG: 0
      # Validador de PDF da Assinatura (serviço validador_pdf, profile `assinatura`). Vazios = não configurado: o envio
      # recusa os níveis gov.br e ICP-Brasil e o PDF final sai sem selo. Sem `:?` de propósito (vale o mesmo motivo do
      # serviço voto). Runbook: docs/runbooks/assinatura-validador-em-producao.md.
      ASSINATURA_VALIDADOR_URL: ${ASSINATURA_VALIDADOR_URL:-}
      ASSINATURA_VALIDADOR_TOKEN: ${ASSINATURA_VALIDADOR_TOKEN:-}
    # Sem depends_on do validador_pdf de propósito: ele fica "unhealthy" enquanto as âncoras não chegam (ITI fora do
    # ar, volume perdido), e o php não pode deixar de subir por isso (spec da etapa 6, seção 6).
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_prod:/var/www/app/public/uploads
      - static_prod:/var/www/static
    healthcheck:
      # O entrypoint roda cache:warmup + migrations ANTES de exec php-fpm, então a
      # porta 9000 só abre quando o app está realmente pronto: checar a porta é o
      # gate de readiness que o deploy usa para sair do modo manutenção.
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - saas_net
      - assinatura_net

  # Worker da Fase 2 do sync: consome a fila `async` (Messenger/doctrine) e sincroniza no Drive,
  # em segundos, a pasta de cada evento. Lê as credenciais do banco (TenantDriveConexao), não do
  # .sync-oauth.env. Mesma imagem do php, mas com o entrypoint BYPASSADO (não re-roda migrations/
  # asset-copy — quem faz isso é o serviço php) e cache já warmado no build da imagem.
  worker:
    build:
      context: .
      target: prod
      secrets:
        - composer_auth
    container_name: jusprime_worker_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      APP_ENV: prod
      APP_DEBUG: 0
      PUBLICACAO_BLOGS_DIR: /var/publicacao-blogs
      # O selo do PDF final (etapa 8) roda numa mensagem assíncrona: o worker também fala com o validador_pdf.
      ASSINATURA_VALIDADOR_URL: ${ASSINATURA_VALIDADOR_URL:-}
      ASSINATURA_VALIDADOR_TOKEN: ${ASSINATURA_VALIDADOR_TOKEN:-}
    working_dir: /var/www/app
    entrypoint: []
    # --time-limit + --memory-limit fazem o consumidor sair periodicamente; o restart o traz de volta
    # com memória fresca (padrão recomendado para workers de longa duração).
    # `scheduler_cadeias` (App\Shared\Scheduler\AgendaDasCadeias) gera as varreduras do push, do Google Agenda,
    # das automações e do expansor de campanhas, que vão para `comercial` e `async`. Fica AQUI, não no serviço
    # `scheduler`: o worker sobe em todo deploy, e o agendador pode ficar desligado pela trava do crontab. Vem
    # primeiro porque é leve (só põe uma mensagem na fila, no máximo uma por minuto) e uma fila longa de e-mails
    # não pode atrasar o relógio das varreduras.
    command: ["php", "-d", "memory_limit=256M", "bin/console", "messenger:consume", "scheduler_cadeias", "comercial", "async", "--time-limit=3600", "--memory-limit=192M", "-v"]
    volumes:
      # MESMO volume de uploads do php: o worker precisa LER o arquivo recém-anexado para
      # enviá-lo ao Drive (Via A) e GRAVAR os que baixar (Via B) no armazenamento compartilhado.
      # Sem isto, o caminho aponta para o filesystem efêmero da imagem → doc não sobe / arquivo quebrado.
      - uploads_prod:/var/www/app/public/uploads
      # Pedidos de geração dos blogs (spec painel-artigos-blogs, seção 6.1): o worker monta o pacote aqui e o
      # blog_builder o lê em /pedidos.
      - publicacao_blogs:/var/publicacao-blogs
    # Sem depends_on do validador_pdf, pelo mesmo motivo do php.
    depends_on:
      db:
        condition: service_healthy
      php:
        condition: service_healthy
    networks:
      - saas_net
      - assinatura_net

  # Agendador de tarefas (Symfony Scheduler; docs/specs/scheduler-tarefas-agendadas.md): roda as tarefas que
  # antes estavam no crontab do host (purga, DJEN, resumos, relatórios, foto do Dashboard, envio ao Drive...),
  # nos horários de App\Shared\Scheduler\AgendaDeTarefas, em Brasília. Espelha o worker: mesma imagem, env e
  # volume, entrypoint BYPASSADO (quem roda as migrations é o php, por isso o depends_on dele saudável).
  # Consumidor próprio, separado do worker: uma tarefa longa não atrasa a fila do Drive nem a dos e-mails.
  # Log no stderr: `docker logs jusprime_scheduler_prod`. Certbot e backups continuam no crontab do host.
  scheduler:
    build:
      context: .
      target: prod
      secrets:
        - composer_auth
    container_name: jusprime_scheduler_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      APP_ENV: prod
      APP_DEBUG: 0
      PUBLICACAO_BLOGS_DIR: /var/publicacao-blogs
    working_dir: /var/www/app
    entrypoint: []
    # -d memory_limit=256M como no worker: o padrão da imagem (128M) cairia antes do --memory-limit=192M.
    # --time-limit faz o consumidor sair de hora em hora e o restart o traz de volta; o estado (tabela
    # cache_agendador) faz a tarefa que passou da hora durante a parada rodar ao voltar.
    command: ["php", "-d", "memory_limit=256M", "bin/console", "messenger:consume", "scheduler_default", "--time-limit=3600", "--memory-limit=192M", "-vv"]
    volumes:
      # Os comandos agendados leem e gravam arquivos no mesmo armazenamento do php e do worker (envio ao Drive).
      - uploads_prod:/var/www/app/public/uploads
      # A tarefa blog:conferir-publicacoes lê aqui o resultado do blog_builder e apaga a pasta do pedido.
      - publicacao_blogs:/var/publicacao-blogs
    depends_on:
      db:
        condition: service_healthy
      php:
        condition: service_healthy
    networks:
      - saas_net

  # BlueJus Voto (spec docs/specs/bluejus-voto.md, D1-B e D2; fase A2): o mesmo código, num PHP-FPM próprio, para
  # uma eleição não tomar os processos nem as conexões do BlueJus. Atende só as rotas `voto_publico_` (APP_PAPEL,
  # App\Voto\EventListener\PapelDoContainer); o nginx chega a ele pelo vhost voto.bluejus.com.br.
  # DESLIGADO por padrão: só existe com o profile `voto` (COMPOSE_PROFILES=voto no .env.prod), que o Samuel liga à
  # mão pelo docs/runbooks/voto-subir-na-vps.md. Sem ports: só o nginx fala com ele, pela rede interna.
  # Entra no banco com o usuário próprio do Voto (VOTO_DATABASE_URL, voto_app com CONNECTION LIMIT), nunca com o do
  # BlueJus. Não roda migrations nem copia assets (bin/entrypoint.voto.sh): espera o php saudável, que já migrou.
  # O rollback automático do deploy NÃO cobre este serviço (só php, worker e scheduler).
  voto:
    build:
      context: .
      target: prod
      secrets:
        - composer_auth
    container_name: jusprime_voto_prod
    profiles: ["voto"]
    restart: unless-stopped
    # SEM env_file de propósito: o .env.prod inteiro traria ao Voto a senha do banco do dono, o APP_SECRET do BlueJus
    # e as chaves de R2, Anthropic e Google. O Voto recebe só esta lista (os ${...} vêm do --env-file .env.prod na
    # hora do compose). Toda %env(X)% sem padrão da config precisa estar aqui, senão o container não sobe
    # (VotoInfraArquiteturaTest avisa).
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      APP_ENV: prod
      APP_DEBUG: 0
      APP_PAPEL: voto
      # Usuário próprio do Voto (voto_app). SEM `:?` de propósito: o compose interpola o arquivo inteiro, inclusive
      # serviço de profile desligado (medido no Docker Compose 2.40.3), e um `:?` aqui derrubaria TODO deploy
      # enquanto a variável não existir. A falta pesa só neste container: vazia, o bin/entrypoint.voto.sh recusa
      # subir e diz o que falta. O mesmo vale para o APP_SECRET.
      DATABASE_URL: ${VOTO_DATABASE_URL:-}
      # Segredo PRÓPRIO do Voto (sessão, CSRF e assinaturas), nunca o do BlueJus.
      APP_SECRET: ${VOTO_APP_SECRET:-}
      # Fixo: é o endereço do vhost (scripts/vps/vhosts/voto.conf.https-pendente). Serve aos links absolutos gerados
      # fora de requisição; uma variável a mais no .env.prod só abriria espaço para divergir do vhost.
      DEFAULT_URI: https://voto.bluejus.com.br
      # Só o endereço do Voto; o BlueJus segue com a lista dele no .env.prod. `\z` é o fim do texto no PCRE: faz o
      # papel do `$` sem depender do escape de `$` do compose.
      SYMFONY_TRUSTED_HOSTS: '^voto\.bluejus\.com\.br\z'
      # Não é segredo; sem ele o IP do cliente atrás do nginx sai errado nos limites por IP.
      SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES:-}
      # Obrigatórias na config, sem uso no Voto: valores inofensivos, como no .env do build (Dockerfile).
      MAILER_DSN: null://null
      MAILER_FROM: nao-responda@bluejus.com.br
      DATAJUD_API_KEY: x
      DATAJUD_BASE_URL: x
      DJEN_BASE_URL: x
    entrypoint: ["sh", "/var/www/app/bin/entrypoint.voto.sh"]
    command: ["php-fpm"]
    volumes:
      # Pool próprio (pm.max_children e companhia; números provisórios até o teste de carga, D2).
      - ./docker/voto/php-fpm-voto.conf:/usr/local/etc/php-fpm.d/zz-voto.conf:ro
    mem_limit: 768m
    cpus: 1
    healthcheck:
      # Igual ao do php: a porta 9000 só abre depois do cache:warmup do entrypoint.
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      php:
        condition: service_healthy
    networks:
      - saas_net

  # Builder dos blogs (spec docs/specs/painel-artigos-blogs.md, seção 6 opção A e 6.1): vigia os pedidos que o
  # worker monta em publicacao_blogs, gera o Blog BlueJus e o Grátis com o código do sfbdata/sites-bluejus (deploy
  # key SÓ LEITURA) e, só se os testes e o build passarem, troca sites-publicados/{blog,gratis}. Sem porta.
  # Roda como 33:33 (o www-data do php), para ele e o worker lerem e escreverem os mesmos arquivos.
  # Dono dos volumes: volume nomeado vazio herda o dono do ponto de montagem da imagem do contêiner que o monta
  # primeiro. As duas imagens já trazem o ponto com 33:33 (a do builder cria /pedidos e /cache; a do php cria
  # /var/publicacao-blogs com www-data), então tanto faz quem monta primeiro: o volume nasce 33:33.
  # Limites: o build do Astro já passou de 13 GB numa máquina sem teto, e com o sharp pode passar de 1 GB
  # (NODE_OPTIONS + cpus + mem_limit). Um builder por vez: trava em /pedidos/.trava (laco.sh).
  blog_builder:
    build: ./builder-blog
    container_name: jusprime_blog_builder_prod
    restart: unless-stopped
    user: "33:33"
    environment:
      HOME: /cache
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - publicacao_blogs:/pedidos
      - ./sites-publicados:/sites-publicados
      - blog_builder_cache:/cache
      - /opt/jusprime/secrets/sites_deploy_key:/chave:ro
    cpus: 1
    mem_limit: 1536m
    networks:
      - saas_net

  # Validador de PDF assinado da Assinatura de documentos (spec docs/specs/assinatura-documentos-etapa-6.md, E6-1 a
  # E6-3, e etapa 8 para o selo): Python com pyHanko, imagem construída aqui mesmo a partir de validador-pdf/ (alvo
  # `producao`). Confere a cadeia gov.br e ICP-Brasil do PDF assinado e sela o PDF final com o e-CNPJ.
  # DESLIGADO por padrão: só existe com o profile `assinatura` (COMPOSE_PROFILES no .env.prod), que o Samuel liga pelo
  # docs/runbooks/assinatura-validador-em-producao.md. O rollback automático do deploy NÃO cobre este serviço.
  # Redes (E6-2): `assinatura_net` (interna, só php, worker e ele) para receber os pedidos; `validador_saida` só para
  # baixar LCR, OCSP e as cadeias do ITI. Nunca na saas_net (lá roda o blog_builder com npm de terceiros). Sem ports.
  # Só amd64: os hashes dos requirements são das wheels linux x86_64 (seção 6 da spec).
  # Healthcheck: o do Dockerfile (/saude). Ele fica "unhealthy" enquanto faltar raiz de uma família (503), e por
  # isso ninguém depende dele com service_healthy.
  validador_pdf:
    build:
      context: ./validador-pdf
      target: producao
    container_name: jusprime_validador_pdf_prod
    profiles: ["assinatura"]
    platform: linux/amd64
    restart: unless-stopped
    # Raiz só de leitura; o forkserver do Python precisa de /tmp (socket) e as âncoras moram no volume.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Teto do contêiner, não reserva: até 2 conferências ao mesmo tempo (configuracao.py, SIMULTANEAS), cada filho
    # preso a 1536 MB pelo RLIMIT (execucao.py, a primeira barreira), mais o processo principal. Um PDF hostil para
    # aqui antes de levar a VPS junto. Quando reduzir: docs/runbooks/assinatura-validador-em-producao.md, passo 0.
    mem_limit: 3584m
    cpus: 1.5
    # SEM env_file de propósito: o .env.prod inteiro traria ao validador as senhas e chaves do BlueJus. Só o que o
    # validador-pdf/validador/configuracao.py lê, e só as variáveis cujo vazio quer dizer "não configurado". As de
    # caminho, porta, memória e URL do ITI ficam de fora: vazias, derrubariam o contêiner ou apagariam o endereço.
    environment:
      ASSINATURA_VALIDADOR_TOKEN: ${ASSINATURA_VALIDADOR_TOKEN:-}
      # Impressões digitais SHA-256 de raiz nova do ITI, separadas por vírgula (só acrescentam; vazio = só as do código).
      ASSINATURA_VALIDADOR_ICP_SHA256: ${ASSINATURA_VALIDADOR_ICP_SHA256:-}
      ASSINATURA_VALIDADOR_GOVBR_SHA256: ${ASSINATURA_VALIDADOR_GOVBR_SHA256:-}
      # Carimbo do tempo de uma ACT ICP-Brasil (E8-3). Vazio: o selo sai sem carimbo (PAdES B-B).
      ASSINATURA_SELO_TSA_URL: ${ASSINATURA_SELO_TSA_URL:-}
    volumes:
      # Última cópia boa das âncoras (E6-5), conferida de novo ao subir. O caminho é o padrão do configuracao.py.
      - validador_ancoras:/dados
    # Chave do selo (E8-2): PKCS#12 do e-CNPJ e a senha, montados só aqui, em /run/secrets. O PHP nunca vê a chave.
    # Runbook: docs/runbooks/assinatura-selo-ecnpj-em-producao.md.
    secrets:
      - selo_pkcs12
      - selo_pkcs12_senha
    networks:
      - assinatura_net
      - validador_saida

  nginx:
    image: nginx:alpine
    container_name: jusprime_nginx_prod
    restart: unless-stopped
    volumes:
      # PASTA, não arquivo: bind-mount de arquivo único amarra o INODE, e o `git pull`
      # não edita no lugar — grava um arquivo novo e renomeia por cima. O container ficava
      # preso no inode antigo para sempre, sem erro e sem log. Em 19/08/2026 produção rodou
      # 8 semanas com a config de 27/06 (CSS/JS ainda com cache immutable de 30 dias, sendo
      # que o arquivo tinha `no-cache` desde 17/07). Montando a pasta, o arquivo novo aparece
      # — e o passo de reload no script de deploy é o que faz o nginx passar a usá-lo.
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_prod:/var/www/app/public:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      # Página de manutenção + flag (maintenance.on). O :ro só impede escrita pelo
      # container; o deploy cria/remove a flag no host e o nginx vê na hora.
      - ./nginx/maintenance:/var/www/maintenance:ro
      # Os 3 sites estáticos (repositório sfbdata/sites-bluejus: site, blog e gratis), já construídos. Fora do git
      # (sites-publicados/ no .gitignore); o nginx serve do disco, sem passar pelo PHP. PASTA, pelo mesmo motivo do
      # conf.d acima: trocar o conteúdo não exige recriar o container.
      - ./sites-publicados:/var/www/sites:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - php
    networks:
      - saas_net

  db:
    image: postgres:15
    container_name: jusprime_db_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_net

networks:
  saas_net:
  # Assinatura (E6-2): interna, sem saída para a internet; só php, worker e validador_pdf.
  assinatura_net:
    internal: true
  # Saída do validador_pdf para o ITI (LCR, OCSP e cadeias); ninguém mais entra nela.
  validador_saida:

volumes:
  db_data_prod:
  uploads_prod:
  static_prod:
  publicacao_blogs:
  blog_builder_cache:
  validador_ancoras:

# Credencial usada SÓ durante o build (composer install), nunca em runtime.
# O arquivo mora na VPS, fora do git — ver .composer-auth.json.example.
# O deploy cria um `{}` vazio se ele não existir, para o build não quebrar por
# falta de arquivo; sem token, porém, o GitHub volta a limitar por IP.
secrets:
  composer_auth:
    file: ./.composer-auth.json
  # Selo da Assinatura (etapa 8, E8-2): fora do git, só na VPS, lidos só pelo validador_pdf (usuário 10001, dono dos
  # arquivos). Vazios = selo não configurado: o PDF final sai sem selo. Com o profile `assinatura` ligado os dois
  # PRECISAM existir: ausentes, o Docker não cria o contêiner e o deploy falha. Com o profile desligado o compose os
  # ignora. Runbooks: assinatura-validador-em-producao.md (cria vazios) e assinatura-selo-ecnpj-em-producao.md.
  selo_pkcs12:
    file: /opt/jusprime/secrets/selo_pkcs12
  selo_pkcs12_senha:
    file: /opt/jusprime/secrets/selo_pkcs12_senha