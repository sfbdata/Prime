services:
  php:
    build:
      context: .
      target: prod
      secrets:
        - composer_auth
    container_name: jusprime_php_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      APP_ENV: prod
      APP_DEBUG: 0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_prod:/var/www/app/public/uploads
      - static_prod:/var/www/static
    healthcheck:
      # O entrypoint roda cache:warmup + migrations ANTES de exec php-fpm, então a
      # porta 9000 só abre quando o app está realmente pronto: checar a porta é o
      # gate de readiness que o deploy usa para sair do modo manutenção.
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - saas_net

  # Worker da Fase 2 do sync: consome a fila `async` (Messenger/doctrine) e sincroniza no Drive,
  # em segundos, a pasta de cada evento. Lê as credenciais do banco (TenantDriveConexao), não do
  # .sync-oauth.env. Mesma imagem do php, mas com o entrypoint BYPASSADO (não re-roda migrations/
  # asset-copy — quem faz isso é o serviço php) e cache já warmado no build da imagem.
  worker:
    build:
      context: .
      target: prod
      secrets:
        - composer_auth
    container_name: jusprime_worker_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      APP_ENV: prod
      APP_DEBUG: 0
    working_dir: /var/www/app
    entrypoint: []
    # --time-limit + --memory-limit fazem o consumidor sair periodicamente; o restart o traz de volta
    # com memória fresca (padrão recomendado para workers de longa duração).
    # `scheduler_cadeias` (App\Shared\Scheduler\AgendaDasCadeias) gera as varreduras do push, do Google Agenda,
    # das automações e do expansor de campanhas, que vão para `comercial` e `async`. Fica AQUI, não no serviço
    # `scheduler`: o worker sobe em todo deploy, e o agendador pode ficar desligado pela trava do crontab. Vem
    # primeiro porque é leve (só põe uma mensagem na fila, no máximo uma por minuto) e uma fila longa de e-mails
    # não pode atrasar o relógio das varreduras.
    command: ["php", "-d", "memory_limit=256M", "bin/console", "messenger:consume", "scheduler_cadeias", "comercial", "async", "--time-limit=3600", "--memory-limit=192M", "-v"]
    volumes:
      # MESMO volume de uploads do php/nginx: o worker precisa LER o arquivo recém-anexado para
      # enviá-lo ao Drive (Via A) e GRAVAR os que baixar (Via B) no armazenamento compartilhado.
      # Sem isto, o caminho aponta para o filesystem efêmero da imagem → doc não sobe / arquivo quebrado.
      - uploads_prod:/var/www/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
      php:
        condition: service_healthy
    networks:
      - saas_net

  # Agendador de tarefas (Symfony Scheduler; docs/specs/scheduler-tarefas-agendadas.md): roda as tarefas que
  # antes estavam no crontab do host (purga, DJEN, resumos, relatórios, foto do Dashboard, envio ao Drive...),
  # nos horários de App\Shared\Scheduler\AgendaDeTarefas, em Brasília. Espelha o worker: mesma imagem, env e
  # volume, entrypoint BYPASSADO (quem roda as migrations é o php, por isso o depends_on dele saudável).
  # Consumidor próprio, separado do worker: uma tarefa longa não atrasa a fila do Drive nem a dos e-mails.
  # Log no stderr: `docker logs jusprime_scheduler_prod`. Certbot e backups continuam no crontab do host.
  scheduler:
    build:
      context: .
      target: prod
      secrets:
        - composer_auth
    container_name: jusprime_scheduler_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      APP_ENV: prod
      APP_DEBUG: 0
    working_dir: /var/www/app
    entrypoint: []
    # -d memory_limit=256M como no worker: o padrão da imagem (128M) cairia antes do --memory-limit=192M.
    # --time-limit faz o consumidor sair de hora em hora e o restart o traz de volta; o estado (tabela
    # cache_agendador) faz a tarefa que passou da hora durante a parada rodar ao voltar.
    command: ["php", "-d", "memory_limit=256M", "bin/console", "messenger:consume", "scheduler_default", "--time-limit=3600", "--memory-limit=192M", "-vv"]
    volumes:
      # Os comandos agendados leem e gravam arquivos no mesmo armazenamento do php e do worker (envio ao Drive).
      - uploads_prod:/var/www/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
      php:
        condition: service_healthy
    networks:
      - saas_net

  nginx:
    image: nginx:alpine
    container_name: jusprime_nginx_prod
    restart: unless-stopped
    volumes:
      # PASTA, não arquivo: bind-mount de arquivo único amarra o INODE, e o `git pull`
      # não edita no lugar — grava um arquivo novo e renomeia por cima. O container ficava
      # preso no inode antigo para sempre, sem erro e sem log. Em 19/08/2026 produção rodou
      # 8 semanas com a config de 27/06 (CSS/JS ainda com cache immutable de 30 dias, sendo
      # que o arquivo tinha `no-cache` desde 17/07). Montando a pasta, o arquivo novo aparece
      # — e o passo de reload no script de deploy é o que faz o nginx passar a usá-lo.
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_prod:/var/www/app/public:ro
      - uploads_prod:/var/www/app/public/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      # Página de manutenção + flag (maintenance.on). O :ro só impede escrita pelo
      # container; o deploy cria/remove a flag no host e o nginx vê na hora.
      - ./nginx/maintenance:/var/www/maintenance:ro
      # Os 3 sites estáticos (repositório sfbdata/sites-bluejus: site, blog e gratis), já construídos. Fora do git
      # (sites-publicados/ no .gitignore); o nginx serve do disco, sem passar pelo PHP. PASTA, pelo mesmo motivo do
      # conf.d acima: trocar o conteúdo não exige recriar o container.
      - ./sites-publicados:/var/www/sites:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - php
    networks:
      - saas_net

  db:
    image: postgres:15
    container_name: jusprime_db_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_net

networks:
  saas_net:

volumes:
  db_data_prod:
  uploads_prod:
  static_prod:

# Credencial usada SÓ durante o build (composer install), nunca em runtime.
# O arquivo mora na VPS, fora do git — ver .composer-auth.json.example.
# O deploy cria um `{}` vazio se ele não existir, para o build não quebrar por
# falta de arquivo; sem token, porém, o GitHub volta a limitar por IP.
secrets:
  composer_auth:
    file: ./.composer-auth.json