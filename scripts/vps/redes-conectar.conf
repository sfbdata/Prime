# Redes Docker que o nginx compartilhado (jusprime_nginx_prod) precisa alcançar.
# Uma por linha. Lido por nginx-redes-conectar.sh, junto com as redes que tenham
# o label `bluejus.nginx=conectar`.
#
# ESTE ARQUIVO É A PONTE PARA O LEGADO, NÃO O CAMINHO PADRÃO.
# Sistema NOVO não entra aqui: ele declara o label na própria rede, no compose
# dele, e é descoberto sozinho. Exemplo:
#
#   networks:
#     bluejus_meusistema_net:
#       labels:
#         bluejus.nginx: "conectar"
#
# As redes abaixo foram criadas antes dessa convenção. Pôr label em rede que já
# existe exige recriá-la — o que derrubaria o sistema no ar. Conforme cada uma
# for naturalmente recriada com o label, a linha correspondente sai daqui.

bluejus_connect_net
bluejus-sign_default
bluejus_videoconferencia_default
condominio_condominio_net

# jusprime_saas_net não entra: é a rede do próprio compose do nginx, que o
# Compose já garante em todo `up -d`.
