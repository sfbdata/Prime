# Portão de qualidade de todo PR para o master: o que roda em segundos e pega quebra de
# configuração, template, mapeamento ou regra de negócio isolada antes do merge.
#
# O que roda e por quê:
#   - lint:yaml / lint:twig / lint:container — erro de sintaxe ou de injeção que só apareceria
#     no deploy (o container de prod faz cache:warmup no build).
#   - doctrine:schema:validate --skip-sync — mapeamento Doctrine são. Não compara com banco:
#     a sincronia é conferida no ritual de migration (scripts/frente-fechar.sh).
#   - tests/*/Unit + tests/Arquitetura + tests/Twig — 5216 testes, ~40 s, zero skip (medido em
#     14/10/2026). Os Unit não tocam banco; dois testes de Arquitetura/Twig sobem o kernel e rodam
#     contra o banco que este job monta só com `schema:create` — que, de quebra, prova que o
#     mapeamento gera DDL válido no PostgreSQL 15.
#   - --fail-on-skipped: vários testes se pulam sozinhos quando falta algo do ambiente (gs,
#     posix, /proc). Sem a flag, um runner divergente ficaria verde com menos cobertura.
#   - PHPStan nível 5 em src/ (app/phpstan.dist.neon): o legado está nos baselines; erro novo
#     reprova, inclusive em arquivo legado alterado. Lê o container de TESTE, que o cache:warmup
#     gera logo antes.
#   - PHP-CS-Fixer só nos arquivos PHP CRIADOS pelo PR (scripts/qa-arquivos-novos.sh, com -M:
#     arquivo movido não conta). Só em pull_request: no push o master já recebeu o que o PR
#     validou, e no workflow_dispatch não há base para saber o que é novo.
#
# O que NÃO roda, de propósito:
#   - Functional/Integration: parte deles precisa da extensão `unaccent`, das funções do schema
#     public e de índices que vêm de SQL cru das migrations — que, por sua vez, supõem dados de
#     um dump (ver scripts/frente-abrir.sh). Em banco de `schema:create` dão falso vermelho.
#     Eles rodam no job "Suíte completa" (suite-completa.yml), que monta o banco a partir do
#     snapshot app/tests/ci/schema-de-teste.sql + migrations mais novas, com o ParaTest.
#   - composer audit: hoje acusa dezenas de advisories herdados; como portão, travaria todo PR.
#
# O ambiente replica do Dockerfile (stage base) o que os testes usam: Ghostscript (compressão e
# contagem de páginas de PDF), bcmath (atualização monetária), gd com freetype/jpeg, intl e o
# fuso America/Sao_Paulo. sodium (CifradorDeSegredo) e posix vêm embutidos na imagem php:8.2;
# aqui ficam explícitos.

name: Qualidade

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR: o run novo cancela o anterior (ele valida o PR inteiro de novo). Push no master: um
  # grupo por run, para nenhum commit do master ficar sem validação.
  group: qualidade-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualidade:
    name: Lints e testes unitários
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: app

    env:
      APP_ENV: test
      TZ: America/Sao_Paulo
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/saas?serverVersion=15&charset=utf8"

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Histórico inteiro: o CS-Fixer de arquivo novo precisa do merge-base com a base do PR.
          fetch-depth: 0

      - name: Instalar Ghostscript
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ghostscript
          gs --version

      - name: Configurar PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          extensions: bcmath, ctype, dom, fileinfo, gd, iconv, intl, libxml, mbstring, pdo_pgsql, posix, simplexml, sodium, xml, xmlreader, xmlwriter, zip, zlib
          ini-values: date.timezone=America/Sao_Paulo, memory_limit=1G
          tools: composer:v2
          coverage: none

      - name: Validar Composer
        run: composer validate --no-check-publish

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint de YAML, Twig e container
        run: |
          php bin/console lint:yaml config --parse-tags
          php bin/console lint:twig templates
          php bin/console lint:container

      - name: Gerar o container de teste para o PHPStan
        run: php bin/console cache:warmup

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=github

      - name: PHP-CS-Fixer nos arquivos novos do PR
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Atribuição, não `< <(...)`: se a base for desconhecida o script sai 2 e o passo falha,
          # em vez de seguir com lista vazia e ficar verde sem ter olhado nada.
          lista=$(cd .. && scripts/qa-arquivos-novos.sh "$BASE")
          novos=()
          [ -n "$lista" ] && mapfile -t novos <<< "$lista"
          echo "Arquivos PHP novos no PR: ${#novos[@]}"
          php bin/qa --sem-phpstan "${novos[@]}"

      - name: Validar mapeamento Doctrine
        run: php bin/console doctrine:schema:validate --skip-sync

      - name: Preparar banco de teste
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:schema:create

      - name: Testes unitarios e de arquitetura
        run: php bin/phpunit --fail-on-skipped tests/*/Unit tests/Arquitetura tests/Twig

      - name: Testes dos scripts de deploy e de versao
        working-directory: .
        run: |
          python3 -m unittest scripts/test_mudancas.py
          bash scripts/testar-deploy-automatico.sh
          bash scripts/testar-deploy-guardas.sh
          bash scripts/testar-qa-arquivos-novos.sh
