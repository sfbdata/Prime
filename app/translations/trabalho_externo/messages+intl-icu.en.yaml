        faq:
            titulo: Frequently asked questions
            gratis: Is it really free?
            gratis_resposta: Yes. Creating the account, registering your résumé, generating the PDF, applying and posting jobs are all free of charge.
            oab: Do I need an OAB license?
            oab_resposta: Not for every position. There are positions for attorneys, interns, students, law graduates and administrative staff. Each position says whether it requires an active OAB.
            divulgar: How does my firm post a job?
            divulgar_resposta: Create the account, click Post a job and fill in the details. The BlueJus team reviews it, publishes it and sends the firm a selection of the best-matching candidates.
            dados: Is my data protected?
            dados_resposta: 'Yes. We follow the LGPD: the résumé is only shared with the firm of the position you apply for, and you can delete everything whenever you want.'
            sistema: What else does BlueJus do?
            sistema_resposta: 'It is a complete management system for law firms: matters, deadlines, publications, goals, financials and an assistant with artificial intelligence.'
        rodape: BlueJus · management for law firms · Positions are posted by firms in the network and reviewed by the BlueJus team.
