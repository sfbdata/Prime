        minimizar_title: 'Minimizar: recolher para o ícone de conversas'
        minimizar: Minimizar
        maximizar: Maximizar
        fechar: Fechar
        busca_placeholder: Pesquisar usuário...
        busca_aria: Pesquisar usuário
        aba_entrada: Caixa de entrada
        aba_painel: Painel
        filtrar: 'Filtrar: {rotulo}'
        filtro:
