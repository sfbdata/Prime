        token_invalido: Token CSRF inválido. Recarregue a página.
        subsecao_adicionada: 'Subseção adicionada na {seccional}.'
        subsecao_removida: 'Subseção removida da {seccional}.'
        nota_salva: 'Nota da {seccional} salva.'
        nota_apagada: 'Nota da {seccional} apagada.'
        nota_cidade_salva: 'Nota de {cidade} salva.'
        nota_cidade_apagada: 'Nota de {cidade} apagada.'
        sede_atualizada: 'Sede da {seccional} atualizada.'
        divulgacao_registrada: 'Divulgação registrada na {seccional}: {status}.'
