        oculta: '{seccional} oculta no mapa.'
        todas_visiveis: Todas as seccionais aparecem no mapa.
        # P2b: as recusas dos UseCases das seccionais (a exceção leva a chave e os parâmetros; o português da
        # constante RECUSA_* é o mesmo daqui, ver o CatalogoDasRecusasDoMasterTest). O limite vai como texto, sem
        # separador de milhar ("1000"), como no sprintf de antes.
        recusa:
            status_de_divulgacao: Escolha o status da divulgação.
            cor_da_marca: Escolha a cor da marca.
            data_formato: Informe a data no formato dia, mês e ano.
            data_no_futuro: A data da divulgação não pode ser no futuro.
            nota_longa: 'A nota passa de {limite} caracteres.'
            cidade_obrigatoria: Informe a cidade da subseção.
            cidade_da_nota_obrigatoria: Informe a cidade da nota.
            cidade_da_nota_fora_das_capitais: A nota por cidade vale só para a capital do estado.
            visibilidade: Informe se a seccional aparece no mapa.
            cidade_longa: 'A cidade passa de {limite} caracteres.'
            endereco_obrigatorio: Informe o endereço da subseção.
            nome_longo: 'O nome passa de {limite} caracteres.'
            endereco_longo: 'O endereço passa de {limite} caracteres.'
            telefone_longo: 'O telefone passa de {limite} caracteres.'
            site_longo: 'O site passa de {limite} caracteres.'
            site_sem_https: 'Informe o site completo, começando com http:// ou https://.'
            subsecao_nao_encontrada: Subseção não encontrada.
        # Rótulo do tipo de divulgação (TipoDeDivulgacao::rotulo() é o português).
        tipo:
            material: Material enviado
            reuniao: Reunião
            parceria: Parceria
        # Rótulo do status da divulgação (StatusDaDivulgacao::rotulo() é o português; desenho 05 L902).
        status:
            env: Material enviado
            vis: Reunião ou evento
            neg: Em negociação
            cli: Parceria firmada
            ret: Retornar depois
            sem: Convênio feito
    # P2b: respostas do ContasDoSistemaController (suspender, reativar e excluir).
    contas:
