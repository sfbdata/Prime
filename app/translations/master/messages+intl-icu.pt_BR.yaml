            nota: 'Esta tela não mostra nem recebe a chave da API.'
        chave_geral:
            titulo: Chave geral
            rotulo: Ligar a BlueJus IA para todos os escritórios liberados
            desc: 'Esta chave é sua. Desligada, nenhum escritório usa a IA, mesmo liberado, e o que estiver na fila é cancelado.'
        modelo:
            titulo: Modelo
            campo: MODELO DA ANTHROPIC
        retencao:
            titulo: Retenção das respostas
            campo: GUARDAR AS RESPOSTAS DA IA POR N MESES
            aviso: 'As respostas e perguntas da BlueJus IA mais antigas que isso são apagadas todo dia às 00:20; ficam só os números de custo.'
        escritorios:
            titulo: Escritórios
            nota: 'Para usar a IA, o escritório precisa estar liberado aqui e o administrador dele precisa ligar a IA e dar o aceite. Em "Incluso no plano" e "Adicional pago", a IA para quando o gasto do mês chega ao orçamento e volta no dia 1º; em "Limite grátis, depois cobra", o orçamento é a parte grátis e a IA continua. Sem orçamento, não há trava em dólares. Valores estimados pelo preço de tabela da Anthropic.'
