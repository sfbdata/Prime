    # Aba "Configurações da I.A." (master/_ia, spec ia-anthropic-ligar §10) e as recusas do IaDoMasterController.
    ia:
        instalacao:
            titulo: Instalação
            intro: 'Estes dois itens ficam no servidor e são configuração técnica da equipe BlueJus; aqui aparece o estado de cada um.'
            chave_api: Chave da API
            trava: Chave de segurança do servidor
