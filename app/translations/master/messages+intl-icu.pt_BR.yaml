# ---- master: Painel do Master (master/painel.html.twig e painel.js), da série da b5. P2a: a moldura do painel (abas,
# Permissões, Telas e recursos) e a Visão geral do painel.js (KPIs, gráfico, mapa, estados que faltam, seccionais e
# janela da OAB), com as respostas das seccionais. P2b: as outras seções do painel.js, as recusas das seccionais, as
# respostas das contas e dos planos e os rótulos da faixa etária e do tipo de divulgação; o Comercial da 5d tem
# bloco de topo próprio (comercial:). P3: Central de Notificações, Indicações, masters.js, recursos.js e o mapa
# mundial, com as respostas e recusas dos controllers deles. O termo solto ou numa frase curta vem de termos.* por
# parâmetro.
master:
    painel:
        titulo_pagina: 'Editar Perfil | {papel} do Sistema'
        titulo: 'Editar Perfil: {papel} do Sistema'
        voltar: Voltar
        cancelar: Cancelar
        aba:
            painel: Painel do sistema
            permissoes: Permissões
            recursos: Telas e recursos
            ia: Configurações da I.A.
        faixa: Painel exclusivo do Master. Mostra metadados das contas (quantidades, consumo, situação), nunca o conteúdo jurídico dos escritórios.
        carregando: Carregando o painel…
        masters:
            titulo: Masters do sistema
            contagem: '{n} Master(s)'
            tag: '{papel} {nivel}'
            primario_dica: O Master primário não pode ser excluído
            remover: Remover este Master
            vazio: Nenhum usuário com o papel de Master.
            oab: 'OAB {numero}'
            sem_oab: sem OAB
            sem_perfil: sem perfil
            promover_titulo: 'Promover a {papel}'
            promover_campo: Usuário secundário a promover a Master
            promover_escolha: Escolha um usuário secundário da conta *
            promover_info: Precisa estar cadastrado antes como usuário secundário.
            promover_msg: Master secundário tem os poderes do sistema, mas não pode excluir o Master primário. Toda promoção e remoção vai para a auditoria.
            promover: Promover
        poderes:
            titulo: Poderes exclusivos do Master
            fixos_dica: Fixos, não podem ser removidos nem transferidos
            ver_contas: Ver e administrar todas as contas do BlueJus
            suspender: Suspender, reativar e excluir contas
            limites: Definir limites de armazenamento e usuários
            planos: Criar e alterar planos e franquias
            configuracoes: Configurações globais do sistema
            auditoria: Acessar toda a trilha de auditoria do sistema
            masters: Promover e remover Masters secundários
            sem_tempo: Sem restrição de tempo para editar ou excluir
            rodape: Esses poderes só existem no perfil Master. Primários e secundários dos escritórios nunca os recebem.
        papeis:
            titulo: Atribuições por papel
            faz: 'Faz:'
            nao_faz: 'Não faz:'
            master_quem: O criador do BlueJus (Master primário) e quem ele promover (Master secundário).
            master_faz: 'administra a plataforma: contas, limites, planos, custos, infraestrutura, configurações globais e auditoria do sistema.'
            master_nao_faz: não atua dentro dos escritórios nem lê o conteúdo jurídico das contas; não tem perfil de primário nem de secundário.
            primario_quem: Quem abriu a conta (titular) e os sócios que ele promover.
            primario_faz: 'gere o próprio escritório: convida e administra secundários, cria perfis, define permissões, configura módulos e audita a conta.'
            primario_nao_faz: não vê nem altera outras contas, limites contratados ou configurações do sistema.
            secundario_quem: Colaborador convidado pelo primário.
            secundario_faz: trabalha nas pastas, processos e módulos liberados pelo seu perfil.
            secundario_nao_faz: não administra usuários, perfis ou configurações, nem acessa o painel do sistema.
            rodape: Cada papel tem competências separadas. O Master não recebe permissões de escritório e o primário não recebe poderes do sistema.
        recursos:
            titulo: Telas e recursos do sistema
            texto: Desative uma tela ou função enquanto não estiver pronta, por regularidade ética ou por falha. Quem não é Master deixa de ver; o Master continua vendo, marcado em vermelho.
            desativados: '{n} desativado(s) para os usuários'
            tudo_ativo: Tudo ativo
            busca: Buscar tela ou função
    seccionais:
