# Catálogo do português, a fonte do texto da tela (spec docs/specs/idioma-do-sistema.md, entrega 3 em diante).
# Um bloco por área, na ordem das entregas; cada PR de área mexe só no seu bloco.
# Formato ICU: parâmetro é {nome}; apóstrofo se escreve ''. Chave do JS (sob <area>.js) vai crua ao navegador: só usa
# {nome}, sem plural, e o apóstrofo fica simples (lá ninguém desfaz o '').
# Não entram: nomes dos idiomas (cada um no próprio idioma), nomes de pessoas, números, CPF/CNPJ, citações de lei.

