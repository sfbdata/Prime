            regra_buscas: Searches, counts, downloads, exports and reports show only their matters
            regra_sem_acesso: No access to the firm dashboard, general reports, financials, roles and settings
            regra_transferir: Cannot transfer responsibility for the matter to another person
            regra_auditoria: Every access and every blocked attempt is kept in the audit trail
            regra_troca: If the responsible person is changed, they are unlinked and lose access, unless kept as a team member
            identificacao: ROLE LABEL
            identificacao_dica: Shown prominently in the role list and in the user record, to identify who is on the sales team or a partner.
            aviso: The permissions below apply only within those matters. Administrative items stay blocked while restricted access is on. Current roles do not change.
            item_bloqueado: Blocked under access restricted to assigned matters
            grupo_bloqueado: Blocked under restricted access
            escopo: Applies only to the matters the user is responsible for
            escopo_cliente: Applies only to the matters the user is responsible for (clients of those matters)
            escopo_documento: Applies only to the matters the user is responsible for (documents of those matters)
            escopo_processo: Applies only to the matters the user is responsible for (cases of those matters)
