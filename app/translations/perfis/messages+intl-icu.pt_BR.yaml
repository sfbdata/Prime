        proprio_perfil: Seu perfil não pode trocar o próprio perfil. Peça ao usuário primário do escritório.
        perfil_acima_do_seu: Seu perfil só pode atribuir perfis com permissões que ele também tem.
        alvo_acima_do_seu: Seu perfil não pode mexer em quem tem permissões que ele não tem.
        senha_de_outro_escritorio: Esta pessoa também usa outro escritório. A senha só pode ser trocada por ela, em Meu Perfil, ou pelo suporte.
    js:
        excluir_titulo: Excluir perfil
        excluir_texto: 'O perfil "{nome}" será excluído.'
        excluir_usuarios: Os {n} usuário(s) com este perfil ficam sem perfil até você atribuir outro.
        marcar_todos: Marcar todos
        desmarcar_todos: Desmarcar todos
        grupo_bloqueado: Bloqueado no acesso restrito
        resumo: '{ativos} de {total} permissões ativas'
        escolha_secundario: Escolha um usuário secundário da conta.
        promover_titulo: Promover a primário
        promover_texto: '"{nome}" passará a gerir o escritório como primário sócio: secundários, perfis, permissões e módulos. Ele não poderá excluir o primário titular.'
        promover_confirmar: Confirmar promoção
        remover_titulo: Remover primário
        remover_texto: '"{nome}" deixa de ser primário e volta a ser secundário. A remoção fica na auditoria da conta.'
