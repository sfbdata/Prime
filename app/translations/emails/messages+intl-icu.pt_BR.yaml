# ---- emails: e-mails do sistema (email/*; os de email/comercial no sub-bloco emails.comercial)
# Renderizados também fora de requisição (worker do Messenger, comandos): o tradutor cai no default_locale (pt_BR).
# Hoje saem no idioma da requisição de quem disparou; o idioma do destinatário é a entrega E (spec §5). Frase com
# <b>/<strong>/link no meio vai partida em chaves, com a marcação no template. Contagem entra como texto (sem
# separador de milhar, como antes). Os assuntos montados no PHP ficam com o PHP da área.
emails:
    cadastro_confirmacao:
        titulo: Confirme seu cadastro no BlueJus
        ola: 'Olá, {nome}!'
        # Recebemos o seu cadastro no <strong>BlueJus</strong> para o escritório <strong>{escritório}</strong>. Falta só...
        recebemos: Recebemos o seu cadastro no
        para_o_escritorio: para o escritório
        falta_confirmar: Falta só confirmar seu e-mail para ativar a conta.
        clique: Clique no botão abaixo para confirmar. O link expira em 24 horas.
        botao: Confirmar meu cadastro
        nao_funcionar: 'Se o botão não funcionar, copie e cole este endereço no navegador:'
        ignore: Se você não fez este cadastro, ignore este e-mail.
    # Aviso de login novo (spec login-aviso-novo): o assunto "Novo acesso à sua conta" fica no AvisoDeAcessoNovoMailer.
    acesso_novo:
        titulo: Novo acesso à sua conta
        ola: 'Olá, {nome}!'
        aviso: 'Detectamos um acesso à sua conta do BlueJus a partir de um navegador ou rede que ainda não conhecíamos:'
        quando: Data e hora
        navegador: Navegador
        sistema: Sistema
        desconhecido: Não identificado
        se_foi_voce: Se foi você, não precisa fazer nada.
        se_nao_foi: Se não foi você, troque a sua senha agora.
        botao: Trocar a senha
        nao_funcionar: 'Se o botão não funcionar, copie e cole este endereço no navegador:'
    codigo_exclusao_conta:
        titulo: Código para excluir a conta
        ola: 'Olá, {nome}!'
        # Recebemos um pedido para excluir a conta do escritório <strong>{escritório}</strong> no BlueJus.
        pedido_inicio: Recebemos um pedido para excluir a conta do escritório
        pedido_fim: no BlueJus.
        use_codigo: 'Para confirmar, use este código:'
        vale: O código vale por 15 minutos.
        digite: Digite-o no Meu Perfil, com a palavra EXCLUIR.
        nao_foi_voce: 'Se não foi você, ignore este e-mail: a conta continua como está.'
    codigo_senha:
        titulo: 'Seu código BlueJus: {codigo}'
        ola: 'Olá, {nome}!'
        # Use este código para criar uma nova senha no <strong>BlueJus</strong>:
        use_codigo: Use este código para criar uma nova senha no
        vale: Ele vale por 15 minutos.
        nao_pediu: Se você não pediu uma nova senha, ignore este e-mail. Sua senha atual continua valendo.
    convite_escritorio:
        titulo: Convite para colaborar no BlueJus
        ola_nome: 'Olá, {nome}!'
        ola: Olá!
        # <strong>{escritório}</strong> convidou você...; sem escritório, <strong>Um escritório</strong>
        um_escritorio: Um escritório
        convidou: convidou você para colaborar como membro no BlueJus.
        # Convite enviado por <strong>{nome}</strong>.; sem quem criou, <strong>um administrador</strong>
        enviado_por: Convite enviado por
        um_administrador: um administrador
        ver_convite: Ver convite
        # Este convite expira em <strong>{data}</strong>.
        expira: Este convite expira em
        nao_funcionar: 'Se o botão não funcionar, copie e cole este link no seu navegador:'
        nao_esperava: Se você não esperava este convite, pode ignorá-lo com segurança. Nenhuma ação será realizada sem sua confirmação.
    convite_plataforma:
        titulo: Convite para o BlueJus
        ola_nome: 'Olá, {nome}!'
        ola: Olá!
        # Você foi convidado para criar sua conta no <strong>BlueJus</strong>, a plataforma...
        convidado_inicio: Você foi convidado para criar sua conta no
        convidado_fim: ', a plataforma de gestão jurídica para advogados e escritórios.'
        oab: Para concluir seu cadastro, você precisará informar seu número de inscrição na OAB.
        criar_conta: Criar minha conta
        # Este convite expira em <strong>{data} às {hora}</strong>.
        expira: Este convite expira em
        data_as_hora: '{data} às {hora}'
        nao_funcionar: 'Se o botão não funcionar, copie e cole este link no seu navegador:'
        nao_solicitou: Se você não solicitou este convite, ignore este e-mail. Nenhuma conta será criada sem que você clique no link acima.
    indicacao:
        convite:
            ola: Olá!
            # <b>{quem indica}</b> indicou o BlueJus para você...
            indicou: indicou o BlueJus para você. O BlueJus reúne prazos, processos e documentos do escritório em um só lugar, e é grátis para começar.
            crie: Crie a sua conta pelo convite. Você abre o seu próprio escritório no BlueJus.
            criar_conta: Criar minha conta
            nao_funcionar: 'Se o botão não funcionar, copie e cole este endereço no navegador:'
    perfil:
        resumo_diario:
            bom_dia_nome: 'Bom dia, {nome}.'
            bom_dia: Bom dia.
            seu_dia: 'Este é o seu dia em {escritorio}, {dia}.'
            prazos: 'Prazos e audiências de hoje ({quantos})'
            metas: 'Metas que vencem hoje ({quantos})'
            pasta: 'Pasta {pasta}'
            agenda: Agenda
            abrir: Abrir o BlueJus
    push_aviso_equipe:
        ola: 'Olá, {nome}!'
        tipo_de_data: '{tipo} de {data}'
        restantes: 'E mais {quantas} movimentação(ões) na pasta.'
        abrir_pasta: Abrir a pasta
        motivo: Você recebe este aviso porque é o responsável pela pasta e o aviso por e-mail está ligado na aba Push.
        descadastro: Não quero mais receber estes avisos
    push_cliente:
        motivo: 'Você recebe este e-mail porque é cliente de {escritorio}. Para responder, use o botão Responder do seu e-mail.'
        um_escritorio: um escritório
        descadastro: Não quero mais receber estes avisos
    redefinicao_senha:
        titulo: Redefinição de senha no BlueJus
        ola: 'Olá, {nome}!'
        # Recebemos um pedido para redefinir a senha da sua conta no <strong>BlueJus</strong>.
        recebemos: Recebemos um pedido para redefinir a senha da sua conta no
        # Clique no botão abaixo para criar uma nova senha. <strong>O link vale por 1 hora</strong> e só pode ser usado uma vez.
        clique: Clique no botão abaixo para criar uma nova senha.
        vale: O link vale por 1 hora
        uma_vez: e só pode ser usado uma vez.
        botao: Criar nova senha
        nao_funcionar: 'Se o botão não funcionar, copie e cole este endereço no navegador:'
        nao_pediu: Se você não pediu a redefinição, ignore este e-mail. Sua senha atual continua valendo.
    trabalho_externo_convite:
        titulo: Convite para uma demanda de trabalho externo
        ola: 'Olá, {nome}!'
        # A Central... convidou você para executar <strong>{serviço}</strong> em <strong>{local}</strong>, como {função}.
        convidou: A Central de Trabalho Externo do BlueJus convidou você para executar
        em: em
        como: ', como {funcao}'
        acesso: 'Você terá acesso somente a esta demanda: instruções, documentos autorizados, checklist e chat. Se ainda não tem conta no BlueJus, poderá criar uma ao abrir o convite.'
        ver_convite: Ver convite
        # Este convite vale até <strong>{data}</strong>.
        vale: Este convite vale até
        nao_funcionar: 'Se o botão não funcionar, copie e cole este link no seu navegador:'
        nao_esperava: Se você não esperava este convite, pode ignorá-lo com segurança. Nenhuma ação será realizada sem sua confirmação.
    # Os e-mails do Comercial (email/comercial/*, spec idioma-do-sistema §25.C). O layout serve a todo e-mail do
    # Carteiro, inclusive às campanhas do Master: só o texto fixo dele está aqui; o conteúdo da campanha é do usuário.
    # Assunto, selo e título das automações (ModelosDeAutomacao), o assunto da confirmação e as frases do
    # RotulosDoConsentimento ficam no PHP. O texto passado aos macros de _blocos é escapado no macro, como antes.
    comercial:
        layout:
            enviado_por: 'Enviado por {escritorio} por meio do BlueJus.'
            razao_social: BlueJus Gestão e Tecnologia LTDA · CNPJ 66.803.163/0001-10 · Brasília/DF
            motivo_lista: Você recebeu este e-mail porque se cadastrou no BlueJus ou autorizou o envio de novidades.
            motivo_conta: Você recebeu este e-mail por causa da sua conta no BlueJus.
            descadastro_lista: Não quero mais receber
            descadastro_escritorio: 'Não quero mais receber e-mails de {escritorio}'
            descadastro_plataforma: Não quero receber novidades do BlueJus
            politica: Política de Privacidade
        confirmacao_endereco:
            confirme: 'Confirme que quer receber {lista}'
            clique: Clique no botão abaixo para confirmar seu e-mail. O link vale por 7 dias.
            botao: Confirmar meu e-mail
            nao_funcionar: 'Se o botão não funcionar, copie e cole este endereço no navegador:'
        boas_vindas:
            texto: Seu e-mail foi confirmado e a sua conta está pronta. A partir de agora, prazos, processos, documentos e equipe ficam em um só lugar.
            comece: Comece por aqui
            pasta_titulo: 1. Abra sua primeira pasta
            pasta_resumo: Cadastre o cliente e o sistema numera a pasta automaticamente.
            processo_titulo: 2. Vincule o processo
            processo_resumo: O Push processual passa a acompanhar os andamentos.
            equipe_titulo: 3. Convide sua equipe
            equipe_resumo: Cada pessoa entra como secundária e você define as permissões.
            botao: Abrir o BlueJus
        espaco_100:
            texto: O armazenamento chegou a 100%. Seus arquivos continuam guardados e disponíveis para consulta e download, mas novos envios ficam pausados até ampliar o espaço.
            botao: Solicitar mais espaço
        espaco_90:
            # {limite} é o percentual escolhido na automação (80, 85 ou 90), como texto.
            texto: 'O armazenamento do seu escritório no BlueJus está com {limite}% ocupado. Quando chegar a 100%, o envio de novos documentos fica pausado (consultar e baixar continua liberado).'
            aumente_titulo: Aumente o espaço
            aumente_resumo: Mude para um plano maior em poucos cliques, sem perder nada.
            libere_titulo: Ou libere espaço
            libere_resumo: Use a sugestão de exclusão de documentos repetidos e vazios dentro das pastas.
            botao: Aumentar meu espaço
        lembrete_confirmacao:
            texto: Recebemos o cadastro da sua conta no BlueJus. Para proteger o acesso e liberar todas as funções, confirme que este e-mail é seu.
            botao: Confirmar e criar minha senha
            # A linha em branco (\n\n) separa os parágrafos: o macro texto de _blocos parte por ela.
            validade: "O link vale por 7 dias.\n\nSe você não criou esta conta, ignore este e-mail."
        pedido_espaco:
            texto: Recebemos o seu pedido para ampliar o espaço da conta. A equipe BlueJus vai confirmar o novo plano com você, e nenhum arquivo é apagado enquanto isso.
            botao: Abrir o BlueJus
        primeiros_passos:
            prazos_titulo: Prazos lidos das pastas
            prazos_resumo: Escreva a data no registro e ela vira prazo automaticamente.
            chat_titulo: Chat I.A
            chat_resumo: Pergunte quais pastas estão paradas ou o que vence hoje.
            perfil_titulo: Meu Perfil
            perfil_resumo: Cadastre sua OAB principal e as suplementares.
            botao: Continuar no BlueJus
