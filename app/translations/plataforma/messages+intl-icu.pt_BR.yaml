# ---- plataforma: área do Master fora de escritório (admin/platform/_base_platform, _sidebar_platform, convites,
# dashboard, oab), com os flashes do AdminConviteController e do OabReviewController. Frase com "Master" recebe
# termos.master por parâmetro ({termo}). O _base_platform só tem CSS e não tem chave. As contagens ICU usam =1 (no
# pt_BR o "one" pega o zero também) e {qtd} é o número já como texto (sem separador de milhar).
plataforma:
    menu:
        painel: Dashboard
        convites: Convites
        revisao_oab: Revisão de OAB
        sistema: Sistema
