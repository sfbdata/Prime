# ---- Sincronização: conexão do Drive do escritório (sync/drive_conexao)
sync:
    drive:
        titulo: Conectar meu Drive
        cartao: Sincronização com o Google Drive
        explicacao: Conecte a conta do Google do escritório para sincronizar as pastas e documentos com o seu Google Drive. Só administradores do escritório podem alterar esta conexão.
        conta_conectada: Conta conectada
        conta_padrao: conta Google
        status: Status
        ativa: Ativa
        falta_pasta_raiz: Falta a pasta-raiz
        pasta_raiz: Pasta-raiz
        nao_informado: Não informado
        conectado_em: Conectado em
        pasta_raiz_rotulo: Pasta-raiz do acervo no Drive (ID ou link)
        salvar_pasta: Salvar pasta
        pasta_raiz_ajuda: Cole o link da pasta do Drive que é a raiz do acervo deste escritório.
        reconectar: Reconectar conta
        desconectar_confirmar: Desconectar o Drive deste escritório? A sincronização para até reconectar.
        desconectar: Desconectar
        conectar: Conectar conta Google
        reconhecimento:
            cartao: Pastas que já estavam no Drive
            explicacao: Ao conectar, o sistema procura na pasta-raiz as pastas que já existem e liga cada uma à pasta do escritório de mesmo nome, para não criar pastas em dobro. Quando não tem certeza, a pasta aparece aqui para você decidir. Enquanto você não decide, o envio não cria pasta nova no Drive para as pastas sugeridas.
            vazio: Nenhuma pasta do Drive esperando decisão.
            aguardando: As pastas do Drive estão sendo reconhecidas. Até terminar, o envio não cria pasta nova no Drive.
            falhou: 'O reconhecimento falhou e o envio não cria pasta nova no Drive até ele terminar. Clique em "Reconhecer de novo" para tentar de novo.'
            nome_no_drive: Pasta no Drive
            ligar_a: Pasta do escritório
            candidata: "Nº {numero}: {cliente}"
            numero_da_pasta: Nº da pasta
            ligar: Ligar a esta pasta
            ignorar: Ignorar
            reconhecer_de_novo: Reconhecer de novo
