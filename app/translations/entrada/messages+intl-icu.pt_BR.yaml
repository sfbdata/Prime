# ---- entrada: tela de entrada e véu (security/login, security/entrando, registration/confirm, auth/entrada.js). O que
# vem do PHP fica fora: as frases da tarja (SecurityController::FRASES), os textos da ContaAConfirmar, os links do
# rodapé e os destinatários do suporte (PaginaDeEntrada), os flashes e as respostas dos endpoints. Os textos de
# segurança são os do desenho 10, confirmados pelo dono. Os assuntos do suporte são dado (o servidor compara o
# português, EnviarMensagemSuporteInput::ASSUNTOS): só o rótulo sai daqui. A régua de força usa auth.js.forca.*.
