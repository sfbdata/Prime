        rotulo: Segurança e privacidade
        tag: SEGURANÇA E PRIVACIDADE
        titulo: O sigilo do seu escritório começa aqui.
        lead: 'Advocacia é confiança. O BlueJus foi construído para que as informações dos seus clientes fiquem só com quem tem direito a elas: você e a equipe que você autorizar.'
        criptografia_texto: Documentos, registros e conversas são cifrados antes de sair do seu aparelho e só são abertos por quem o escritório autorizou. Nem a equipe BlueJus tem acesso ao conteúdo das suas pastas.
        terceiros: Nenhum terceiro vê os seus dados
        terceiros_texto: Não vendemos, não compartilhamos e não usamos as informações do escritório para publicidade. Cada conta fica isolada das demais.
        controle: Você controla quem acessa
        controle_texto: O usuário primário define permissões, oculta abas e tranca pastas sigilosas. Cada acesso e alteração fica registrado com data, hora e autor.
        conexao: Conexão protegida
        conexao_texto: Todo o tráfego usa HTTPS com certificado válido, e as sessões de aparelhos sem uso são encerradas automaticamente.
        lgpd:
            titulo: Em conformidade com a LGPD (Lei nº 13.709/2018)
            controlador: O escritório é o controlador; o BlueJus atua como operador.
            finalidade: Dados usados só para prestar o serviço contratado.
            direitos: 'Direitos do titular: acesso, correção, portabilidade e exclusão.'
            incidentes: Incidentes comunicados ao escritório e à ANPD.
