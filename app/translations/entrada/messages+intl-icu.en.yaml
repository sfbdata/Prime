        rotulo: Security and privacy
        tag: SECURITY AND PRIVACY
        titulo: Your firm confidentiality starts here.
        lead: 'Practicing law is built on trust. BlueJus was built so that your client information stays only with those entitled to it: you and the team you authorize.'
        criptografia_texto: Documents, records and conversations are encrypted before leaving your device and are only opened by those the firm authorized. Not even the BlueJus team has access to the contents of your matters.
        terceiros: No third party sees your data
        terceiros_texto: We do not sell, share or use the firm information for advertising. Each account is isolated from the others.
        controle: You control who has access
        controle_texto: The primary user sets permissions, hides tabs and locks confidential matters. Every access and change is logged with date, time and author.
        conexao: Protected connection
        conexao_texto: All traffic uses HTTPS with a valid certificate, and sessions on idle devices are ended automatically.
