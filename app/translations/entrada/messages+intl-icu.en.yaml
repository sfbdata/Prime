            finalidade: Data used only to provide the contracted service.
            direitos: 'Data subject rights: access, correction, portability and deletion.'
            incidentes: Incidents reported to the firm and to the ANPD.
            encarregado: Data protection officer (DPO) available.
            exportacao: Full export of your data whenever you want.
        cresce: Security that helps the firm grow
