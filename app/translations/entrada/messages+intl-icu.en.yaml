# ---- entrada: sign-in screen and veil (security/login, security/entrando, registration/confirm, auth/entrada.js). What
# comes from PHP stays out: the banner phrases (SecurityController::FRASES), the ContaAConfirmar texts, the footer
# links and the support recipients (PaginaDeEntrada), the flashes and endpoint responses. The security texts are
# those of design 10, confirmed by the owner. The support subjects are data (the server compares the Portuguese,
# EnviarMensagemSuporteInput::ASSUNTOS): only the label comes from here. The strength meter uses auth.js.forca.*.
