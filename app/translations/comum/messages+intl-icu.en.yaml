            acao_editar: edit
            acao_excluir: delete
            recurso_cliente: client
            descricao_padrao: 'I request to {acao} the {recurso}{identificador}.'
            enviando: Sending...
            enviar: Send Request
            descreva_motivo: Please describe the reason for the request.
            enviada: Request sent.
            erro_enviar: Error sending request. Try again.
        # modal_nova_pasta (inline script)
        nova_pasta:
            erro_criar: Could not create the matter.
            erro_conexao: Connection failure while creating the matter. Try again.
        # modal_mover_marcador (inline script)
        mover_marcador:
