        restaurado: Restaurado da Lixeira
        envio_cancelado_pela_exclusao: Envio cancelado pela exclusão. Links desativados
        documento_enviado: Enviado para assinatura. Hash {hash_inicio}...
        convite_enviado: Convite enviado por e-mail a {nome}
        email_nao_enviado: E-mail não enviado a {nome}
        link_aberto: '{nome} abriu o link'
        codigo_enviado: Código de verificação enviado a {nome}
        codigo_errado: Código incorreto informado por {nome}
        assinado: '{metodo, select, reforcada {Assinado por {nome} · E-mail e código, selfie, localização {local}} govbr {Assinado por {nome} · Conta gov.br} icp {Assinado por {nome} · Certificado ICP-Brasil} other {Assinado por {nome} · E-mail e código}}'
        recusado: 'Recusado por {nome}: {motivo}'
        documento_concluido: Documento concluído
        lembrete_enviado: Lembrete enviado a {nome}
        envio_cancelado: Envio cancelado. Documento e evidências preservados
        # Etapa 3: o vínculo à pasta (contrato da etapa 3, seção 2, item 9).
        vinculo_definido: 'Definido o vínculo à pasta {nup} ao concluir'
        vinculo_feito: 'Documento assinado vinculado à pasta {nup}'
        vinculo_nao_aplicado: 'Vínculo à pasta {nup} não aplicado: {motivo}'
        # Etapa 5: gov.br e ICP (contrato da etapa 5, seção 2, item 5). O `motivo` da recusa é o código do erro do envio
        # do PDF assinado (o mesmo de `assinatura_eletronica_publica.js.certificado.erro.<motivo>`).
        pdf_para_assinar_gerado: 'PDF para assinar gerado para {nome}'
        pdf_assinado_recusado: 'PDF assinado enviado por {nome} recusado: {motivo, select, sem_assinatura {nenhuma assinatura digital no arquivo} alterada {assinatura que não confere com o conteúdo} prefixo {o arquivo não preserva a versão anterior} sem_assinatura_nova {nenhuma assinatura nova no arquivo} ilegivel {arquivo que não pôde ser lido} sem_cpf {certificado sem CPF} cpf_diferente {CPF do certificado diferente do cadastrado} cadeia_recusada {certificado não confirmado pela cadeia oficial} cadeia_indisponivel {validador de certificados indisponível} other {arquivo não aceito}}'
        # Etapa 8: o selo PAdES do BlueJus no PDF final (spec da etapa 8, E8-4). O `motivo` do não aplicado é o código
        # da falha, só para a auditoria: não entra no texto.
        pdf_selado: PDF final selado pelo BlueJus
        selo_nao_aplicado: PDF final guardado sem o selo do BlueJus
