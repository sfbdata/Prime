            pausados: New uploads are paused. Viewing and downloading files is still available.
            sem_espaco: There is no free space left. Viewing and downloading files is still available.
            liberamos_antes: We automatically unlocked the
            liberamos_negrito: extra storage options
            liberamos_depois: for your firm. BlueJus stays free; extra storage is optional.
            agora_nao: Not now
            ver_opcoes: View storage options
    # Scheduled task failure notice (layout/_globais/aviso_falha_agendada)
    aviso_falha_agendada:
        titulo: Scheduled task failed
        item: '{tarefa} at {hora} on {data}.'
        mais: There are other, older failures.
        detalhe: The details are recorded by the BlueJus team.
        # Name of each task in the notice (key = command without "app:", with _ in place of : and -).
        tarefa:
            purgar_dados_expirados: Expired data cleanup
            inteligencia_expirar_conteudo: BlueJus AI response retention
            desempenho_purgar: Performance records cleanup
            documentos_purgar_lixeira: Documents trash cleanup (30 days)
            importar_indices_monetarios: Monetary index import
            djen_sincronizar: DJEN publication capture
            push_resumo_semanal_cliente: Weekly client summary
            pastas_rotina_controladoria: Monday Docket control routine
            pastas_relatorio_sem_processo: Matters without a case report
            pastas_relatorio_pastas_paradas: Idle matters report
            dashboard_fotografar: Daily Dashboard snapshot
            master_retratar_metricas: Daily Master Panel metrics snapshot
            sync_reconciliar: Upload to Google Drive
            contribua_conciliar_assinaturas: Storage subscription reconciliation
            pagamento_conciliar: Payment reconciliation with the bank
            armazenamento_replicar_espelho: File copy to R2
            armazenamento_reconciliar_espelho: R2 copy check
            armazenamento_limpar_replicacao: R2 upload queue cleanup
            blog_conferir_publicacoes: Blog article publishing
            voto_executar_programacao: Scheduled opening and closing of Voting
            conector_faxinar: Cleanup of expired AI connector connections
            outra: Scheduled task
        dispensar: Dismiss
    # Email sending quota notice (layout/_globais/aviso_cota_de_envio)
    aviso_cota_de_envio:
