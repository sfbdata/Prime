        texto_pausadas: 'Campaigns are paused and will resume sending around {hora} on {data}. Account and invitation emails keep going out.'
        dispensar: Dismiss
    # Scheduled maintenance notice (layout/_globais/aviso_manutencao; text written by the Master in Global settings)
    aviso_manutencao:
