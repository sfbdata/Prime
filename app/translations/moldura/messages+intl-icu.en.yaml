            uso_de_limite: '{uso} of {limite}'
            hoje_usa_percentual: '({percentual}%).'
            quanto: How much storage do you think you will need?
            opcao_20: Up to 20 GB
            opcao_50: Up to 50 GB
            opcao_100: More than 50 GB
            motivo: What will you use it for (optional)
            motivo_exemplo: 'E.g., digitizing the old cases of the firm'
            sem_cobranca: Requesting does not generate a charge. Meanwhile, everything keeps working and your files are never deleted for lack of space.
