                    titulo: Suspend vote
                    exemplo: 'E.g.: power outage in the hall'
                    efeito_1: It stops accepting votes now, until the board resumes it.
                    efeito_2: Votes already deposited stay in the box, intact.
                    efeito_3: The deadline set by the board is frozen during the suspension.
                    efeito_4: Anyone who tries to vote sees the suspended vote notice.
                    efeito_5: Resume it from the three-dot menu or on the big screen. Everything is kept in the audit trail.
                can:
                    titulo: Cancel vote
                    exemplo: 'E.g.: irregular call'
                    efeito_1: It stops accepting votes immediately.
                    efeito_2: 'Votes already received stay sealed in the box and are not tallied: there will be no result.'
                    efeito_3: In the minutes, it appears as a canceled vote, with the reason.
                    efeito_4: Box, trail, and data are kept as proof; it can be archived afterwards.
                    efeito_5: It cannot be undone. To repeat it, use Duplicate vote.
