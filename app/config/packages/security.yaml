security:
    password_hashers:
        App\Entity\Auth\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Auth\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            custom_authenticator: App\Security\UserAuthenticator
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                path: /
                secure: true
                httponly: true
                samesite: lax
            logout:
                path: app_logout

    access_control:
        # Criação de escritório: exclusivo para SuperAdmin (liberação manual por enquanto)
        - { path: ^/tenant/new,       roles: ROLE_SUPER_ADMIN }
        - { path: ^/register/confirm, roles: PUBLIC_ACCESS }  # redirect legado
        - { path: ^/invite$,          roles: PUBLIC_ACCESS }  # redirect legado (TODO 5b.3b)
        - { path: ^/convite,          roles: PUBLIC_ACCESS }  # aceite de convite
        - { path: ^/login,            roles: PUBLIC_ACCESS }

        # A partir daqui: apenas usuário autenticado.
        # Autorização fina (o que pode fazer) é responsabilidade dos controllers
        # via PermissionChecker — não do security.yaml.
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\Auth\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
