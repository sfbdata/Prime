# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    default_locale: pt_BR

    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks:
            - pt_BR
            - pt
            - en

    rate_limiter:
        login:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        convite_aceite:
            policy: sliding_window
            limit: 20
            interval: '1 minute'
        # Página pública do link externo do Push (`/p/<endereco>`): chave = IP. Freia a varredura
        # de endereços e o chute do código de acesso (que ainda tem o bloqueio próprio: 5 erros
        # seguidos travam o link por 15 min). 30/minuto pelo mesmo motivo do bloco de senha abaixo.
        push_publico:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        convite_criar:
            policy: sliding_window
            limit: 10
            interval: '1 minute'
        cadastro_auto:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # "Falar com suporte" da tela de entrada (desenho 10): rota anônima que grava no banco e
        # avisa o Master no sino. Chave = IP. 5 por hora cobre quem não consegue entrar e insiste.
        suporte_entrada:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        oab_verificar:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # PDF da Política de Privacidade: cada requisição roda o dompdf sobre um documento
        # de 16 páginas com 11 tabelas (~0,6 s de CPU, contra ~0,25 s da versão HTML). Sem
        # limitador, um curl em laço prende worker de PHP numa rota anônima.
        #
        # O limite é FOLGADO de propósito: getClientIp() é o IP real do cliente (o nginx de
        # produção entrega o $remote_addr por FastCGI; ver nginx.prod.conf e o
        # IpDoClienteAtrasDoNginxTest), mas um escritório inteiro atrás de um NAT divide o
        # mesmo IP. 30/minuto sustenta leitura real e ainda põe teto num laço.
        politica_privacidade_pdf:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        # Página pública de vagas do Trabalho Externo: "Quero receber as vagas" (formulário aberto na
        # internet que grava e-mail). Folgado pelo mesmo motivo dos blocos acima: só vira defesa de
        # verdade com o IP real do cliente em produção. 10 por minuto cobre quem erra o e-mail.
        vagas_alertas:
            policy: sliding_window
            limit: 10
            interval: '1 minute'
        # Clique em "Criar conta" na página pública de vagas (POST /vagas-juridicas/cta, sem login nem
        # CSRF): é só um contador anônimo, e o limite por IP impede que alguém infle o número. 30 por
        # minuto cobre quem abre e volta à página várias vezes.
        vagas_cta:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        # Visita pelo link público de vagas (GET /vagas-juridicas/{token}), chave = IP + token: quem
        # recarrega a página em laço não infla o KPI "visita(s) pelo link". Acima do teto a página
        # abre normalmente, só não conta. 20 por hora cobre quem volta ao link ao longo do dia.
        vagas_visita:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # Recuperação de senha: dois limites somados, com papéis diferentes.
        #
        # O de e-mail é a defesa REAL da vítima: não importa de onde venha o pedido.
        #
        # O de IP é largo de propósito (30, não 5). getClientIp() é o IP real do cliente
        # (nginx.prod.conf; IpDoClienteAtrasDoNginxTest), mas um escritório
        # com saída NAT única divide o mesmo IP, e com limite baixo se derrubaria sozinho.
        senha_esqueci_ip:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
        # 5, não 3: com 3 um atacante tranca a recuperação de uma vítima gastando a cota
        # dela, e o usuário legítimo que digita errado duas vezes já chegava no limite.
        senha_esqueci_email:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Excluir conta (PR 5, docs/specs/conta-pedido-exclusao.md E4): envios do código de 6 dígitos,
        # chave = id do usuário. Cada envio invalida o anterior; 3 em 15 min bastam para quem errou o e-mail.
        exclusao_conta_codigo:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        # BlueJus IA — "Resumir com IA": chave = id do USUÁRIO, não IP (ver os blocos acima sobre
        # SYMFONY_TRUSTED_PROXIES). A cota de verdade é a do escritório (inteligencia_configuracao);
        # este limite só segura clique repetido/laço. 10 por minuto é mais do que um humano faz.
        inteligencia_solicitar:
            policy: sliding_window
            limit: 10
            interval: '1 minute'
        # "Baixar .zip" da seleção no explorador de documentos (SEC-004): chave = id do USUÁRIO.
        # Cada .zip lê até 1 GB, grava um temporário do mesmo tamanho e prende um worker do PHP
        # até o fim do envio. 3 por minuto cobre o uso real (baixar, perceber que faltou um
        # arquivo, baixar de novo) e põe teto no clique repetido ou no laço.
        pasta_documentos_zip:
            policy: sliding_window
            limit: 3
            interval: '1 minute'
        # Avisos no sino disparados pelo Registro da pasta — @menção e "respondeu seu comentário"
        # (SEC-008): chave = id do AUTOR. Limita a NOTIFICAÇÃO, não a mensagem: estourou, a
        # mensagem é gravada e o aviso é suprimido (com log). Cada mensagem pode avisar até 20
        # pessoas; 30 avisos em 10 minutos cobre uma conversa intensa e põe teto no laço.
        pasta_registro_notificacao:
            policy: sliding_window
            limit: 30
            interval: '10 minutes'
        # "Buscar agora" do painel do Push (spec push-painel-monitoramento §2): chave = escritório +
        # PASTA, não usuário. Cada busca consulta o DJEN uma vez por processo da pasta, e o DJEN
        # aceita ~20 requisições por IP na janela: dois cliques na mesma pasta não podem gastar a cota.
        pasta_push_buscar:
            policy: fixed_window
            limit: 1
            interval: '1 minute'
        # Comercial e e-mails (spec comercial-e-emails §3.8): pixel de abertura (/e/a/) e link rastreado (/e/c/),
        # chave = IP. Enquanto SYMFONY_TRUSTED_PROXIES não estiver confirmado na VPS, o IP é o do nginx e o
        # limite vale como teto global; 600 por minuto não atrapalha a leitura de uma campanha e põe teto no laço.
        comercial_rastreio:
            policy: sliding_window
            limit: 600
            interval: '1 minute'
        # "Cadastrar e-mail" do modo venda (spec comercial-e-emails §10, F3h): só o Master usa, e cada pedido leva
        # até 50 endereços. Chave = IP, somada aos limitadores da confirmação (por e-mail, 30 dias do descadastrado e
        # global). 20 por hora cobre o cadastro de uma lista inteira em lotes e põe teto num laço com sessão roubada.
        comercial_contatos_master:
            policy: sliding_window
            limit: 20
            interval: '1 hour'

    # Note that the session will be started ONLY if you read or write from it.
    # gc_maxlifetime = app.sessao_gc_segundos (padrão 1 dia): o arquivo da sessão não some antes do
    # ExpiracaoDaSessaoListener, que limita o prazo a esse valor (spec login-sessao-expiracao).
    session:
        enabled: true
        gc_maxlifetime: '%app.sessao_gc_segundos%'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # Rate limiters em memória (reset por boot) — isola o estado entre testes,
        # senão o cadastro_auto (5/hora por IP) acumula entre runs e dá 429.
        cache:
            pools:
                cache.rate_limiter:
                    adapter: cache.adapter.array
