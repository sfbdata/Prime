# Google Agenda (revisão da b5, item 7): limita conectar, retorno e desconectar por pessoa. Bloco próprio, fora do
# framework.yaml (arquivo quente entre sessões); o Symfony junta os limitadores dos dois arquivos.
framework:
    rate_limiter:
        agenda_google:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'
