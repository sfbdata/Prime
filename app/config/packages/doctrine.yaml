doctrine:
    dbal:
        driver: 'pdo_pgsql'
        url: '%env(resolve:DATABASE_URL)%'

        # Configuração da versão do servidor PostgreSQL
        server_version: '15.0'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        filters:
            tenant:
                class: App\Shared\Doctrine\Filter\TenantFilter
                enabled: false
            # Lixeira da aba Documentos (L7): `excluido_em IS NULL` em PastaDocumento/PastaSecao.
            # Ligado por padrão (web, console e testes); só `AcessoALixeira` o desliga, por escopo.
            lixeira:
                class: App\Shared\Doctrine\Filter\LixeiraFilter
                enabled: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            AppAgenda:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Agenda/Entity'
                prefix: 'App\Agenda\Entity'
                alias: AppAgenda
            AppCliente:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cliente/Entity'
                prefix: 'App\Cliente\Entity'
                alias: AppCliente
            AppProcesso:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Processo/Entity'
                prefix: 'App\Processo\Entity'
                alias: AppProcesso
            AppDjen:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Djen/Entity'
                prefix: 'App\Djen\Entity'
                alias: AppDjen
            AppCobranca:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cobranca/Entity'
                prefix: 'App\Cobranca\Entity'
                alias: AppCobranca
            AppContribua:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Contribua/Entity'
                prefix: 'App\Contribua\Entity'
                alias: AppContribua
            AppPagamento:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Pagamento/Entity'
                prefix: 'App\Pagamento\Entity'
                alias: AppPagamento
            AppServiceDesk:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/ServiceDesk/Entity'
                prefix: 'App\ServiceDesk\Entity'
                alias: AppServiceDesk
            AppExpediente:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Expediente/Entity'
                prefix: 'App\Expediente\Entity'
                alias: AppExpediente
            AppProfile:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Profile/Entity'
                prefix: 'App\Profile\Entity'
                alias: AppProfile
            AppKanban:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Kanban/Entity'
                prefix: 'App\Kanban\Entity'
                alias: AppKanban
            AppMaster:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Master/Entity'
                prefix: 'App\Master\Entity'
                alias: AppMaster
            AppPasta:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Pasta/Entity'
                prefix: 'App\Pasta\Entity'
                alias: AppPasta
            AppTermo:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Termo/Entity'
                prefix: 'App\Termo\Entity'
                alias: AppTermo
            AppTenant:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Tenant/Entity'
                prefix: 'App\Tenant\Entity'
                alias: AppTenant
            AppPonto:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Ponto/Entity'
                prefix: 'App\Ponto\Entity'
                alias: AppPonto
            AppAuth:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Auth/Entity'
                prefix: 'App\Auth\Entity'
                alias: AppAuth
            AppSync:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Sync/Entity'
                prefix: 'App\Sync\Entity'
                alias: AppSync
            AppAtualizacaoMonetaria:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/AtualizacaoMonetaria/Entity'
                prefix: 'App\AtualizacaoMonetaria\Entity'
                alias: AppAtualizacaoMonetaria
            AppInteligencia:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Inteligencia/Entity'
                prefix: 'App\Inteligencia\Entity'
                alias: AppInteligencia
            # Indicar o BlueJus (docs/specs/indicar-bluejus.md): dado de plataforma, sem tenant.
            AppIndicacao:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Indicacao/Entity'
                prefix: 'App\Indicacao\Entity'
                alias: AppIndicacao
            # Recompensas do Master (docs/specs/perfis-1.2-vs-25-10-recompensas-e-planos.md): dado de plataforma, sem tenant.
            AppRecompensa:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Recompensa/Entity'
                prefix: 'App\Recompensa\Entity'
                alias: AppRecompensa
            AppDashboard:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Dashboard/Entity'
                prefix: 'App\Dashboard\Entity'
                alias: AppDashboard
            # P2.3: só a tabela da outbox da réplica do espelho (armazenamento_replicacao).
            AppEspelhoRemoto:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/EspelhoRemoto/Entity'
                prefix: 'App\Shared\EspelhoRemoto\Entity'
                alias: AppEspelhoRemoto
            AppTrabalhoExterno:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/TrabalhoExterno/Entity'
                prefix: 'App\TrabalhoExterno\Entity'
                alias: AppTrabalhoExterno
            AppCentral:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Central/Entity'
                prefix: 'App\Central\Entity'
                alias: AppCentral
            AppChatIa:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/ChatIa/Entity'
                prefix: 'App\ChatIa\Entity'
                alias: AppChatIa
            AppComercial:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Comercial/Entity'
                prefix: 'App\Comercial\Entity'
                alias: AppComercial
            # Metas: o contador da sequência por escritório (a Tarefa em si ainda mora no legado src/Entity).
            AppTarefa:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Tarefa/Entity'
                prefix: 'App\Tarefa\Entity'
                alias: AppTarefa
            # Descadastro de e-mail reaproveitável (spec push-avisar-quando-chegar D3): mora em Shared.
            AppSharedEmailDescadastro:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Email/Descadastro/Entity'
                prefix: 'App\Shared\Email\Descadastro\Entity'
                alias: AppSharedEmailDescadastro
            # Falhas das tarefas agendadas (spec scheduler-tarefas-agendadas, "Aviso de falha"): dado do sistema.
            AppSharedScheduler:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Scheduler/Entity'
                prefix: 'App\Shared\Scheduler\Entity'
                alias: AppSharedScheduler
        controller_resolver:
            auto_mapping: false
        dql:
            numeric_functions:
                CAST_INT: App\Shared\Doctrine\DQL\CastInteger
                CAST_INT_PREFIXO: App\Shared\Doctrine\DQL\CastIntegerPrefixo
            string_functions:
                UNACCENT: App\Shared\Doctrine\DQL\Unaccent

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
