framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        #pools:
            #my.dedicated.cache: null

services:
    # Painel do Master (spec perfis-master D8): último retrato das fontes públicas do mapa (IBGE,
    # Quadro da Advocacia da OAB, tabela enviada pelo Master), com fonte e data. Filesystem SEM
    # expiração, fora de var/cache (que o cache:clear apaga): a idade é decidida pelo código e o
    # retrato velho continua valendo quando a fonte falha. Se var/ não persistir no deploy, o
    # comando app:master:atualizar-fontes-publicas refaz o retrato da OAB e da população; a malha
    # municipal do IBGE é buscada de novo na primeira consulta.
    cache.master_fontes:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments:
            $namespace: 'master_fontes'
            $defaultLifetime: 0
            $directory: '%kernel.project_dir%/var/master-fontes/%kernel.environment%'
