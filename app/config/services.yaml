# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    mailer_from: '%env(MAILER_FROM)%'
    uploads_dir: '%kernel.project_dir%/public/uploads/pastas'
    # Uploads ficam em public/uploads/* (volume persistido uploads_prod). A defesa contra
    # acesso direto é o bloqueio de /uploads/ estático no nginx (C5.1) — todos são servidos
    # só por rota controlada (auth+tenant+posse). var/uploads NÃO é volume persistido em prod,
    # então apontar para lá perderia os arquivos no deploy seguinte.
    justificativas_uploads_dir: '%kernel.project_dir%/public/uploads/justificativas'
    chamados_uploads_dir: '%kernel.project_dir%/public/uploads/chamados'
    clientes_uploads_dir: '%kernel.project_dir%/public/uploads/clientes'
    fotos_perfil_dir: '%kernel.project_dir%/public/uploads/perfil'
    ghostscript_bin: '%env(default:default_ghostscript_bin:GHOSTSCRIPT_BIN)%'
    default_ghostscript_bin: '/usr/bin/gs'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $mailerFrom: '%mailer_from%'
            string $datajudApiKey: '%env(DATAJUD_API_KEY)%'
            string $datajudBaseUrl: '%env(DATAJUD_BASE_URL)%'
            string $uploadsDir: '%uploads_dir%'
            string $justificativasUploadsDir: '%justificativas_uploads_dir%'
            string $chamadosUploadsDir: '%chamados_uploads_dir%'
            string $clientesUploadsDir: '%clientes_uploads_dir%'
            string $fotosPerfilDir: '%fotos_perfil_dir%'
            string $ghostscriptBin: '%ghostscript_bin%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

# Em teste, os uploads vão para var/uploads-test/* — gravável pelo usuário que roda os testes,
# isolando-os dos diretórios reais public/uploads/* (que em dev pertencem ao www-data e não são
# graváveis pelo runner). Sem isto, testes que gravam arquivo (ex.: AnexoDownloadControllerTest,
# PecaImagemControllerTest) quebram ou poluem os dados reais.
when@test:
    parameters:
        uploads_dir: '%kernel.project_dir%/var/uploads-test/pastas'
        justificativas_uploads_dir: '%kernel.project_dir%/var/uploads-test/justificativas'
        chamados_uploads_dir: '%kernel.project_dir%/var/uploads-test/chamados'
        clientes_uploads_dir: '%kernel.project_dir%/var/uploads-test/clientes'
        fotos_perfil_dir: '%kernel.project_dir%/var/uploads-test/perfil'
