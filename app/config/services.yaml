# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    mailer_from: '%env(MAILER_FROM)%'
    # Opcional: vazio omite o cabeçalho Reply-To. Em produção, usar uma caixa monitorada.
    mailer_reply_to: '%env(string:default::MAILER_REPLY_TO)%'
    uploads_dir: '%kernel.project_dir%/public/uploads/pastas'
    # Uploads ficam em public/uploads/* (volume persistido uploads_prod). A defesa contra
    # acesso direto é o bloqueio de /uploads/ estático no nginx (C5.1) — todos são servidos
    # só por rota controlada (auth+tenant+posse). var/uploads NÃO é volume persistido em prod,
    # então apontar para lá perderia os arquivos no deploy seguinte.
    justificativas_uploads_dir: '%kernel.project_dir%/public/uploads/justificativas'
    chamados_uploads_dir: '%kernel.project_dir%/public/uploads/chamados'
    clientes_uploads_dir: '%kernel.project_dir%/public/uploads/clientes'
    fotos_perfil_dir: '%kernel.project_dir%/public/uploads/perfil'
    # Documentos do Caso de Cobrança (Etapa 6). Isolamento físico por tenant: os arquivos moram em
    # cobrancas/<tenantId>/<hash> (padrão M5), então o diretório efetivo de cada operação é
    # `%cobrancas_uploads_dir%/<tenantId>`.
    cobrancas_uploads_dir: '%kernel.project_dir%/public/uploads/cobrancas'
    # Anexos de card do Kanban. Antes da E1 o diretório era o literal 'kanban' passado no
    # AdicionarAnexoUseCase — caminho RELATIVO, resolvido contra o WORKDIR do PHP-FPM
    # (/var/www/app em prod), portanto FORA do volume uploads_prod: o arquivo sobrevivia só até
    # o próximo deploy. Agora é absoluto e explícito, como os outros seis.
    kanban_uploads_dir: '%kernel.project_dir%/public/uploads/kanban'
    # Documentos das demandas do Trabalho Externo (categoria plana, nome opaco cunhado pelo storage).
    trabalho_externo_uploads_dir: '%kernel.project_dir%/public/uploads/trabalho-externo'
    ghostscript_bin: '%env(default:default_ghostscript_bin:GHOSTSCRIPT_BIN)%'
    default_ghostscript_bin: '/usr/bin/gs'
    # API pública do SGS do Banco Central (índices INPC/IPCA/taxa legal da calculadora de atualização
    # monetária). Endereço estável e sem chave — por isso o default mora AQUI e não no .env: o build
    # de produção faz `rm .env`, então default nenhum daquele arquivo chega em prod.
    bcb_sgs_base_url: '%env(default:default_bcb_sgs_base_url:BCB_SGS_BASE_URL)%'
    default_bcb_sgs_base_url: 'https://api.bcb.gov.br'
    # Limite de escritórios que um usuário pode CRIAR (ser dono). Sobrescrevível por env
    # em produção, sem deploy de código. Escritórios excluídos (soft delete) não contam.
    tenant_max_por_usuario: '%env(default:default_tenant_max_por_usuario:int:TENANT_MAX_POR_USUARIO)%'
    default_tenant_max_por_usuario: 3
    # Carência (em dias) que um escritório soft-deletado fica em quarentena antes do hard
    # delete definitivo pelo job de purga (RN09). Sobrescrevível por env em produção, sem
    # deploy de código. Enquanto dentro da carência, o suporte ainda pode reativar.
    tenant_carencia_purga_dias: '%env(default:default_tenant_carencia_purga_dias:int:TENANT_CARENCIA_PURGA_DIAS)%'
    default_tenant_carencia_purga_dias: 365
    # Formulário externo de suporte, alcançável por quem NÃO está logado (botão flutuante da
    # tela de entrada). Trocável por env em produção, sem deploy de template. Vazio = o botão
    # continua na tela, mas inerte — é o estado em que nasce, até o endereço ser definido.
    # O default mora AQUI e não no .env porque o build de produção faz `rm .env`.
    suporte_form_url: '%env(string:default:default_suporte_form_url:SUPORTE_FORM_URL)%'
    default_suporte_form_url: ''
    # Sincronização Google Drive. Vazios em dev/test. Dois modos de auth:
    #  - service account (Shared Drive): google_drive_credentials = caminho do JSON.
    #  - OAuth login de usuário (ex.: conta do rclone; ponte atual + futuro "Conectar meu Drive"):
    #    os três google_drive_oauth_*. Com refresh_token presente, o OAuth tem precedência.
    # Credenciais do Drive vazias em dev/test. O processor `string:` garante STRING (nunca null) —
    # binds `string $...` exigem string, e `trim(null)` é deprecation fatal na suíte (failOnDeprecation).
    google_drive_credentials: '%env(default::GOOGLE_DRIVE_CREDENTIALS)%'
    google_drive_shared_drive_id: '%env(string:default::GOOGLE_DRIVE_SHARED_DRIVE_ID)%'
    google_drive_oauth_client_id: '%env(string:default::GOOGLE_DRIVE_OAUTH_CLIENT_ID)%'
    google_drive_oauth_client_secret: '%env(string:default::GOOGLE_DRIVE_OAUTH_CLIENT_SECRET)%'
    google_drive_oauth_refresh_token: '%env(string:default::GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN)%'
    # Chave (base64 de 32 bytes) p/ cifrar segredos do sync em repouso (refresh_token por tenant).
    # Fora do banco; vazia em dev/test sem conexão. Gerar em prod: base64 de random_bytes(32).
    sync_crypto_key: '%env(string:default::SYNC_CRYPTO_KEY)%'
    # BlueJus IA — flag da PLATAFORMA (nível 1 da disponibilidade; o nível 2 é por escritório, na
    # tabela inteligencia_configuracao). Nasce DESLIGADA e o default mora AQUI, não no .env, porque o
    # build de produção faz `rm .env`. Ligar em prod = IA_HABILITADA=1 no .env.prod + provedor real
    # no alias abaixo + Anexo I da Política de Privacidade (decisões D1/D3 da spec).
    ia_habilitada: '%env(default:default_ia_habilitada:bool:IA_HABILITADA)%'
    default_ia_habilitada: false
    # Provedor da BlueJus IA = Anthropic (decisão D1, 14/10/2026). Chave e modelo SÓ por ambiente (.env.prod na
    # VPS, nunca no repositório); vazios = provedor dormente, mesmo com IA_HABILITADA=1. Proposta de modelo e
    # cotas: docs/specs/inteligencia-provedor-anthropic.md.
    ia_anthropic_chave: '%env(string:default::ANTHROPIC_API_KEY)%'
    ia_anthropic_modelo: '%env(string:default::IA_MODELO)%'
    # Esforço (output_config.effort): vazio = padrão do modelo. É a alavanca de custo — ver a proposta.
    ia_anthropic_esforco: '%env(string:default::IA_ESFORCO)%'
    # Folga somada ao max_tokens de cada prompt: o raciocínio adaptativo dos modelos atuais conta no max_tokens.
    ia_anthropic_margem_raciocinio: '%env(int:default:default_ia_anthropic_margem_raciocinio:IA_MARGEM_RACIOCINIO)%'
    default_ia_anthropic_margem_raciocinio: 8000
    # Comercial e e-mails (spec comercial-e-emails §3.6 e §3.8). Defaults AQUI, não no .env (o build de produção faz
    # `rm .env`). Vazão: e-mails por minuto e teto diário (o diário conta tudo o que saiu; os transacionais do ciclo da
    # conta só respeitam o por minuto). Rastreio: só liga com esta flag E PoliticaPrivacidadeVigente::CITA_RASTREIO_DE_EMAIL.
    comercial.envios_por_minuto: '%env(int:default:default_comercial_envios_por_minuto:COMERCIAL_ENVIOS_POR_MINUTO)%'
    default_comercial_envios_por_minuto: 20
    comercial.teto_diario: '%env(int:default:default_comercial_teto_diario:COMERCIAL_TETO_DIARIO)%'
    default_comercial_teto_diario: 1500
    comercial.rastreio_ligado: '%env(default:default_comercial_rastreio_ligado:bool:COMERCIAL_RASTREIO_LIGADO)%'
    default_comercial_rastreio_ligado: false
    # Campanhas (spec comercial-e-emails §8.1.2 e §8.5): a chave da instalação nasce DESLIGADA (o "Enviar campanha" é
    # recusado e o expansor cancela as ativas; trocar exige reiniciar o worker) e o teto diário só das campanhas.
    comercial.campanhas_ligadas: '%env(default:default_comercial_campanhas_ligadas:bool:COMERCIAL_CAMPANHAS_LIGADAS)%'
    default_comercial_campanhas_ligadas: false
    comercial.teto_diario_campanhas: '%env(int:default:default_comercial_teto_diario_campanhas:COMERCIAL_TETO_DIARIO_CAMPANHAS)%'
    default_comercial_teto_diario_campanhas: 1000

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $mailerFrom: '%mailer_from%'
            string $mailerReplyTo: '%mailer_reply_to%'
            string $datajudApiKey: '%env(DATAJUD_API_KEY)%'
            string $datajudBaseUrl: '%env(DATAJUD_BASE_URL)%'
            string $djenBaseUrl: '%env(DJEN_BASE_URL)%'
            string $uploadsDir: '%uploads_dir%'
            string $justificativasUploadsDir: '%justificativas_uploads_dir%'
            string $chamadosUploadsDir: '%chamados_uploads_dir%'
            string $clientesUploadsDir: '%clientes_uploads_dir%'
            string $fotosPerfilDir: '%fotos_perfil_dir%'
            string $cobrancasUploadsDir: '%cobrancas_uploads_dir%'
            string $kanbanUploadsDir: '%kanban_uploads_dir%'
            string $trabalhoExternoUploadsDir: '%trabalho_externo_uploads_dir%'
            string $ghostscriptBin: '%ghostscript_bin%'
            string $bcbSgsBaseUrl: '%bcb_sgs_base_url%'
            int $tenantMaxPorUsuario: '%tenant_max_por_usuario%'
            int $carenciaPurgaDias: '%tenant_carencia_purga_dias%'
            $googleDriveCredentials: '%google_drive_credentials%'
            string $googleDriveSharedDriveId: '%google_drive_shared_drive_id%'
            string $googleDriveOauthClientId: '%google_drive_oauth_client_id%'
            string $googleDriveOauthClientSecret: '%google_drive_oauth_client_secret%'
            string $googleDriveOauthRefreshToken: '%google_drive_oauth_refresh_token%'
            string $syncCryptoKey: '%sync_crypto_key%'
            bool $iaHabilitada: '%ia_habilitada%'
            int $enviosPorMinuto: '%comercial.envios_por_minuto%'
            int $tetoDiario: '%comercial.teto_diario%'
            bool $rastreioLigado: '%comercial.rastreio_ligado%'
            bool $campanhasLigadas: '%comercial.campanhas_ligadas%'
            int $tetoDiarioDeCampanhas: '%comercial.teto_diario_campanhas%'
            Symfony\Component\HttpFoundation\UriSigner $assinadorDeClique: '@comercial.assinador_de_clique'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            # E2.6A (D29) — valor, não serviço: construtor privado, criado por
            # `DiretorioTemporarioPrivado::doProcesso()`. Registrado, o autowiring o injetaria no
            # parâmetro opcional do `ArmazenamentoLocal` e o container quebraria na compilação.
            - '../src/Shared/Armazenamento/DiretorioTemporarioPrivado.php'

    # Backend de verificação de OAB: dormente (manual-first) enquanto não houver chave do
    # web service oficial. Trocar aqui quando houver backend real.
    App\Auth\Service\OabWebServiceClientInterface: '@App\Auth\Service\ClienteOabIndisponivel'

    # BlueJus IA: o provedor é a Anthropic (D1, 14/10/2026). DORMENTE até haver ANTHROPIC_API_KEY e IA_MODELO no
    # ambiente — sem os dois, `estaConfigurado()` é falso e nenhuma chamada sai (igual ao ProvedorNaoConfigurado,
    # que fica para instalação sem IA). Nunca devolve texto que não veio do modelo. Em `when@test` vira o
    # ProvedorFalso (abaixo): a suíte nunca chama a API.
    App\Inteligencia\Service\ProvedorAnthropic:
        arguments:
            $chave: '%ia_anthropic_chave%'
            $modelo: '%ia_anthropic_modelo%'
            $esforco: '%ia_anthropic_esforco%'
            $margemDeRaciocinio: '%ia_anthropic_margem_raciocinio%'
    App\Inteligencia\Service\ProvedorDeLinguagem: '@App\Inteligencia\Service\ProvedorAnthropic'
    # Leitura das movimentações para o contexto da IA (publicações + Datajud), tenant explícito.
    App\Inteligencia\Contexto\FonteDeMovimentacoesDoPush: '@App\Inteligencia\Contexto\FonteDeMovimentacoesDoPushDoctrine'

    # Cliente das séries do Banco Central (índices da calculadora de atualização monetária).
    App\AtualizacaoMonetaria\Service\ClienteSgsBcbInterface: '@App\AtualizacaoMonetaria\Service\ClienteSgsBcb'

    # Cliente do DJEN: injeta a implementação concreta via interface (integração desacoplada).
    App\Djen\Service\DjenClientInterface: '@App\Djen\Service\DjenClient'
    App\Djen\Service\NotificadorPublicacoesDjenInterface: '@App\Djen\Service\NotificadorPublicacoesDjen'
    App\Djen\Service\EsperaEntreConsultasInterface: '@App\Djen\Service\EsperaEntreConsultas'

    # Envio do link de redefinição de senha (interface para o UseCase poder ser testado
    # sem SMTP — é o mailer que prova a resposta neutra da recuperação de senha).
    App\Auth\Service\RedefinicaoSenhaMailerInterface: '@App\Auth\Service\RedefinicaoSenhaMailer'

    # Sequência de números de pasta. Interface para o ExcluirPastaUseCase ser testado com dublê
    # (a decisão entre lápide e exclusão real) enquanto a implementação é provada contra o
    # Postgres de verdade, que é onde a expressão do prefixo e o recorte por tenant vivem.
    App\Pasta\Service\NumeracaoDePastaInterface: '@App\Pasta\Service\NumeracaoDePasta'

    # Conexão somente-leitura das ferramentas MCP. SEM default de propósito: ausente a
    # variável, o servidor falha com mensagem clara em vez de cair na conexão de escrita.
    # O processor `string:` garante STRING (nunca null): `$dsn` do construtor é
    # `string` não-nulável, e sem o `string:` o fallback vazio de `default::` vira `null`
    # (ver `EnvVarProcessor`), estourando `TypeError` no container ANTES de o
    # `RuntimeException` de mensagem clara ter qualquer chance de rodar — mesmo padrão já
    # documentado acima para `google_drive_*`.
    # `public: true` existe por causa de UM teste: `ConexaoLeituraServicoTest`, o único que
    # prova o `%env(string:default::…)%` acima, pega este serviço com
    # `static::getContainer()->get()` — e isso não alcança serviço privado que o compilador
    # tenha removido ou inlinado (era o caso quando o serviço não tinha consumidor nenhum).
    # MEDIDO em 11/08/2026, removendo a linha e rodando `tests/Mcp`: hoje a suíte fica verde
    # SEM ela — o serviço ganhou dois consumidores (as duas ferramentas), sobreviveu à
    # compilação como privado, e o container de teste alcança privado que sobreviveu. A linha
    # fica como garantia: basta um dos dois consumidores sair para o serviço ser inlinado no
    # único que restar, e quem quebra é `ConexaoLeituraServicoTest`, longe daqui.
    # Não remova sem rodar esse teste.
    # `when@test: services:` NÃO serve para isto: reescrever o mesmo ID de serviço em outro
    # bloco `when@` SUBSTITUI a definição inteira em vez de só somar a chave nova (testado —
    # o `$dsn` some do serviço compilado). `public: true` incondicional evita essa armadilha
    # sem duplicar `arguments` em dois lugares que podem divergir.
    App\Mcp\Service\ConexaoLeitura:
        public: true
        arguments:
            $dsn: '%env(string:default::DATABASE_URL_LEITURA)%'

    # 🔴 A guarda que impede um comando do espelho de despejar CPF/e-mail/telefone na tela.
    # Os dois parâmetros do kernel são injetados à mão porque a decisão depende deles: o log
    # verboso do Doctrine sai com debug LIGADO, e o ambiente `test` é a exceção legítima
    # (saída em buffer, dado fabricado). Ver o docblock da classe.
    App\Cobranca\Service\Espelho\GuardaDeLogComPii:
        arguments:
            $debug: '%kernel.debug%'
            $ambiente: '%kernel.environment%'

    # Comercial e e-mails: a porta de envio e o registro (contratos para a 0d e a a7). `public` para os testes de
    # contrato alcançarem as portas pelo container mesmo enquanto nenhum consumidor as usa (serviço privado sem
    # consumidor é removido na compilação; ver o comentário do ConexaoLeitura acima).
    App\Comercial\Envio\CarteiroInterface:
        alias: App\Comercial\Service\Carteiro
        public: true
    App\Comercial\Envio\RegistroDeEnviosInterface:
        alias: App\Comercial\Service\RegistroDeEnvios
        public: true
    # A chave das campanhas (spec §8.1.2): `public` para os testes trocarem a chave no container (o padrão é desligada).
    App\Comercial\Campanha\ChaveDasCampanhas:
        public: true
    # Assinatura do link rastreado (`/e/c/{token}?u=...&s=...`, spec §3.8): HMAC com o kernel.secret, parâmetro `s`.
    # Separado do `uri_signer` do framework (que usa `_hash`) para a URL ter o formato da spec.
    comercial.assinador_de_clique:
        class: Symfony\Component\HttpFoundation\UriSigner
        arguments: ['%kernel.secret%', 's']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

# Em teste, os uploads vão para var/uploads-test/* — gravável pelo usuário que roda os testes,
# isolando-os dos diretórios reais public/uploads/* (que em dev pertencem ao www-data e não são
# graváveis pelo runner). Sem isto, testes que gravam arquivo (ex.: AnexoDownloadControllerTest,
# PecaImagemControllerTest) quebram ou poluem os dados reais.
# O sufixo TESTE_PROCESSO separa os processos do ParaTest (tests/Shared/Paralelo/ProcessoDeTesteParalelo);
# na execução serial é vazio.
when@test:
    parameters:
        uploads_dir: '%kernel.project_dir%/var/uploads-test%env(default::TESTE_PROCESSO)%/pastas'
        justificativas_uploads_dir: '%kernel.project_dir%/var/uploads-test%env(default::TESTE_PROCESSO)%/justificativas'
        chamados_uploads_dir: '%kernel.project_dir%/var/uploads-test%env(default::TESTE_PROCESSO)%/chamados'
        clientes_uploads_dir: '%kernel.project_dir%/var/uploads-test%env(default::TESTE_PROCESSO)%/clientes'
        fotos_perfil_dir: '%kernel.project_dir%/var/uploads-test%env(default::TESTE_PROCESSO)%/perfil'
        cobrancas_uploads_dir: '%kernel.project_dir%/var/uploads-test%env(default::TESTE_PROCESSO)%/cobrancas'
        kanban_uploads_dir: '%kernel.project_dir%/var/uploads-test%env(default::TESTE_PROCESSO)%/kanban'
        trabalho_externo_uploads_dir: '%kernel.project_dir%/var/uploads-test%env(default::TESTE_PROCESSO)%/trabalho-externo'
        # A suíte prova a cadeia inteira da BlueJus IA com o ProvedorFalso: a flag da plataforma fica
        # ligada aqui; o teste que precisa do estado "não configurada" desliga o próprio falso.
        ia_habilitada: true

    services:
        # Página de erro igual à de PRODUÇÃO (sem depuração); o porquê está na classe.
        App\Tests\Shared\Doubles\PaginaDeErroDeProducao:
            decorates: error_handler.error_renderer.html

        # BlueJus IA — o ÚNICO provedor com resposta programada, e ele mora em tests/. `public` para
        # o teste alcançá-lo pelo container e programar a resposta/falha antes da requisição.
        App\Tests\Inteligencia\Support\ProvedorFalso:
            public: true
        App\Inteligencia\Service\ProvedorDeLinguagem: '@App\Tests\Inteligencia\Support\ProvedorFalso'

        # E2.5 — faz o próximo COMMIT da aplicação falhar, sob demanda. Sob o DAMA nenhum COMMIT
        # falha de verdade; sem isto o ramo "o COMMIT lançou" só seria testável com mock.
        # Prioridade abaixo da do DAMA (100): fica por fora dele e recebe o commit() primeiro.
        # Inerte até um teste armar; ver o docblock da classe.
        App\Tests\Shared\Doubles\FalhaDeCommitArmavel:
            tags:
                - { name: doctrine.middleware, priority: -100 }
