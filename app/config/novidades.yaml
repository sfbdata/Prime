# Gerado pelo scripts/mudancas.py no PR de release: o texto vem da seção
# "## Para o cliente" dos arquivos em mudancas/. Lido pela página Novidades.
versoes:
- versao: "2.40.0"
  data: "2026-11-07"
  itens:
    - "Na ficha do colaborador, aba \"Jornada Personalizada\", agora dá para dizer a partir de que dia a jornada nova vale. Exemplo: quem passou de 40 para 44 horas em maio fica com 40 horas até 30 de abril e 44 horas a partir de 1º de maio. A folha e o banco de horas de abril continuam contando 40 horas."
    - "A aba mostra o histórico das jornadas da pessoa: o período de cada uma, qual vale hoje e qual está agendada para começar depois. Cada jornada do histórico pode ser corrigida ou excluída."
    - "Ao escolher uma data no passado, o sistema avisa que a folha e o saldo serão recalculados desde aquele dia, antes de gravar."
    - "\"Limpar jornada personalizada\" apaga a jornada e todo o histórico dela, e a folha de todos os meses volta a usar a jornada do escritório. O aviso de confirmação explica isso antes."
    - "O BlueJus passa a guardar a data em que cada jornada de trabalho começa a valer. É o primeiro passo para que uma troca de jornada (por exemplo, de 40 para 44 horas por semana) valha só dali em diante, sem recalcular a folha e o banco de horas dos meses anteriores."
    - "Nesta versão todas as folhas e todos os saldos, de qualquer mês, ficam exatamente com os mesmos números. O campo para escolher a data de início da nova jornada chega em seguida, na tela de jornada do colaborador."
- versao: "2.39.1"
  data: "2026-11-06"
  itens:
    - "A tela Expedientes ganhou uma trava automática que impede que ela volte a ficar lenta em atualizações futuras: se alguma mudança fizer a tela buscar dados repetidos, o sistema avisa antes de a versão chegar ao cliente."
    - "O aviso sonoro da ida ao intervalo, da volta e do fim da jornada agora toca mesmo com o BlueJus em outra aba ou com o navegador minimizado, desde que a tela do ponto onde você registrou continue aberta. Antes, depois de registrar o intervalo, o som da volta só saía depois de um clique na tela."
    - "Depois de registrar o ponto, a tela se atualiza na hora, sem piscar nem recarregar: as batidas do dia, o banco de horas e o botão já com o próximo registro."
    - "Ao registrar o ponto, o navegador pergunta se pode mostrar notificações. Permitindo, o lembrete do ponto aparece no canto da tela mesmo com o navegador minimizado."
- versao: "2.39.0"
  data: "2026-11-06"
  itens:
    - "A tela Expedientes abre mais rápido: os números ao lado de Prazos, Audiências, Metas e dos outros atalhos da seção EXPEDIENTES são contados de uma vez, e não um por um. Os números são os mesmos de antes, e cada pessoa continua contando só as pastas que pode ver."
    - "A tela Expedientes abre mais rápido: o sistema busca de uma vez os marcadores com os submarcadores e deixa de repetir algumas buscas da barra do topo. A tela mostra exatamente o mesmo de antes, e quem pode ver cada coisa continua igual."
    - "O alerta do ponto agora também toca um som na hora de ir para o intervalo. São três toques diferentes: ida ao intervalo, volta do intervalo e fim da jornada."
    - "Em Meu Perfil, logo abaixo de \"Sons de alerta\", há um botão \"Ouvir\" para cada toque, para conhecer os sons antes de eles tocarem. Os botões aparecem para quem registra ponto."
    - "Para desligar os sons, use a chave \"Sons de alerta\" em Meu Perfil."
- versao: "2.38.0"
  data: "2026-11-06"
  itens:
    - "O acervo geral do expediente abre mais rápido: o sistema busca de uma vez os clientes, os marcadores e as metas de todas as pastas da página, em vez de buscar pasta por pasta. A lista mostra exatamente o mesmo de antes, e quem pode ver cada pasta continua igual."
    - "A lista de pastas do expediente abre mais rápido, principalmente com muitas pastas por página: o sistema busca o cliente de todas as pastas de uma vez, em vez de uma por uma. A lista mostra as mesmas pastas, na mesma ordem, e quem pode ver cada pasta continua igual."
    - "O painel (dashboard) abre um pouco mais rápido: a lista de pessoas e cargos dos filtros é lida uma vez só, em vez de duas. Os filtros mostram exatamente as mesmas opções de antes."
    - "As páginas do sistema ficaram um pouco mais leves: o cabeçalho, o sininho e o menu deixaram de buscar a mesma informação várias vezes ao abrir cada tela."
    - "Pastas trancadas pelo cadeado, preferências do Meu Perfil e avisos do sininho continuam valendo do mesmo jeito: cada pessoa segue vendo só o que já via."
    - "As páginas do sistema abrem um pouco mais rápido: o sistema confere uma vez só, em cada página, se a pessoa faz parte do escritório, em vez de conferir a mesma coisa várias vezes. Quem pode ver e fazer cada coisa continua exatamente igual."
    - "A tela Minhas Metas abre mais leve, principalmente para quem tem muitas metas: o sistema busca a pasta, o cliente e os responsáveis de todas as metas de uma vez, em vez de uma por uma."
    - "A tela continua mostrando as mesmas metas, abas, contagens, indicadores do topo, \"Seu andamento\", \"Precisa de atenção\" e esteira, e o cadeado das pastas continua valendo do mesmo jeito para cada pessoa."
    - "A tela da pasta abre mais leve, principalmente em pastas com muitas metas: o sistema busca os responsáveis e as respostas de todas as metas de uma vez, em vez de uma por uma."
    - "A tela continua mostrando as mesmas abas, metas, responsáveis, botão de excluir, linha do tempo e histórico, e o cadeado continua valendo do mesmo jeito para cada pessoa."
    - "As telas que mostram a equipe do escritório (painel, agenda, Central, acervo e pasta) abrem com menos idas ao banco de dados. A diferença cresce com o tamanho da equipe: antes cada colega somava uma consulta, agora a lista inteira vem de uma vez. O que cada pessoa vê continua igual."
    - "As páginas do sistema ficam mais leves: cada abertura de página consulta bem menos o banco de dados para montar o menu e conferir as permissões, e o contador de avisos do sino também. Quem pode ver o quê continua exatamente igual."
    - "Na tela do ponto, logo abaixo do tempo trabalhado, aparece um número verde (por exemplo, \"+00:37 a mais hoje\") quando a pessoa passa da jornada do dia. Ele conta ao vivo."
    - "No intervalo o número para, junto com o tempo trabalhado. Depois de bater a saída, fica parado no total do dia."
    - "Em feriado e em dia fora da escala de trabalho o número não aparece. É só um aviso na tela: o banco de horas continua calculado como sempre."
    - "O relógio de tempo trabalhado da tela do ponto agora mostra o mesmo total que a folha de ponto. Antes, quando a pessoa batia a volta do intervalo sem ter batido a ida, o relógio contava parte da tarde duas vezes e mostrava mais horas do que a folha registrava."
    - "Também quando a ida ao intervalo foi batida e a volta não, depois da saída o relógio passa a mostrar o dia inteiro, como a folha."
    - "O alerta do ponto eletrônico agora toca um som quando chega a hora de voltar do intervalo e quando chega a hora de ir embora. São dois toques diferentes, um para cada aviso."
    - "O som toca com qualquer tela do sistema aberta. O navegador só libera som depois de um clique ou tecla na tela aberta, e cada vez que a página recarrega (por exemplo, depois de bater o ponto) essa liberação recomeça. Se o aviso aparecer antes desse clique, o som toca no primeiro clique enquanto o aviso estiver na tela. Com o sistema fechado, não toca."
    - "Para desligar o som, use a chave \"Sons de alerta\" em Meu Perfil. Para desligar todo o alerta de horário, desmarque \"Habilitar alertas de ponto\" na jornada do escritório ou do colaborador."
    - "A tela do processo abre mais leve quando ele tem muitas metas: o sistema busca os responsáveis de todas as metas de uma vez, em vez de uma por uma."
    - "A aba Tarefas continua mostrando as mesmas metas e os mesmos responsáveis, e o cadeado das pastas continua valendo do mesmo jeito para cada pessoa."
    - "No Meu Perfil, em Segurança, há o botão \"Sair de todos os aparelhos\". Depois de confirmar, todos os outros computadores e celulares onde você entrou saem da sua conta, inclusive os que usam \"Manter conectado\". O aparelho onde você apertou continua conectado até você sair ou fechar o navegador; depois, entre com a senha. A senha continua a mesma."
    - "Útil quando você entrou num computador de outra pessoa, perdeu o celular ou esqueceu a conta aberta em algum lugar."
    - "Conferimos com testes novos que, depois de muitas tentativas erradas, trocar a senha pelo código do e-mail libera a entrada de novo, e que a tela de login não revela se um e-mail tem conta."
    - "Ajuste interno nos testes automáticos do sistema, que falhavam perto da meia-noite por causa do fuso horário. As telas e os dados continuam funcionando do mesmo jeito."
    - "As telas do sistema abrem um pouco mais rápido: o sininho do topo agora confere os avisos não lidos de uma vez só, em vez de três. Os números do sininho e das abas continuam exatamente os mesmos."
- versao: "2.37.2"
  data: "2026-11-05"
  itens:
    - "Quem perde o acesso a uma pasta deixa de ver, no sino e em \"Ver todas\", os avisos antigos que mostravam trechos daquela pasta."
    - "Quando a aba Financeiro de uma pasta fica oculta para alguém, os avisos antigos de observações financeiras dessa pasta somem do sino e da lista dessa pessoa."
    - "O número do sino passa a contar só os avisos que a pessoa consegue ver na lista."
    - "O registro de auditoria deixa de guardar trechos do texto das análises da BlueJus IA, e os trechos antigos foram apagados."
    - "Passado o prazo de guarda, as conversas do Chat I.A também são apagadas, com os arquivos anexados nelas, como já acontecia com as análises."
    - "Os arquivos enviados ao sistema só são entregues a quem está logado no escritório certo, também por uma segunda barreira no servidor."
    - "O aviso de pagamento do banco Cora fica protegido contra excesso de chamadas, sem mudar nada para quem apoia pelo PIX."
    - "A ferramenta interna de consulta da equipe técnica ficou mais segura contra consultas que travariam o banco."
    - "A folha de ponto, o espelho em PDF e em planilha e a ficha do funcionário passam a buscar batidas e justificativas sempre só do escritório aberto, também nas rotinas automáticas. Quem trabalha em dois escritórios vê, em cada um, só as batidas e justificativas daquele escritório."
    - "Os avisos automáticos de ponto esquecido e de horário passam a olhar só o escritório de onde o aviso sai."
    - "Na tela de escolher o escritório, o sino não mostra mais avisos de escritórios em que a pessoa foi suspensa nem avisos de pastas trancadas para ela."
    - "O profissional convidado para um trabalho externo não vê mais, no chat nem no histórico, o valor de uma nova proposta nem os motivos da renegociação entre a Central e o escritório."
    - "O código PIX da página Contribua só é gerado pelo próprio botão da página, o que evita cobranças criadas por links de outros sites."
    - "Na esteira de Minhas Metas, cada pessoa vê nas caixas só as metas das pastas que pode abrir, além das que são dela."
    - "Na troca de senha pelo Meu Perfil, depois de 5 tentativas com a senha atual errada, a troca fica fechada por alguns minutos. Isso impede que alguém com o computador aberto descubra a senha atual por tentativa."
    - "Na entrada com e-mail e senha, muitas senhas erradas na mesma conta, mesmo vindas de lugares diferentes, fecham a entrada por senha dessa conta por até 1 hora. Quem precisar entrar nesse tempo pode trocar a senha em \"Esqueci minha senha\" e entrar com a senha nova na hora."
    - "Ao clicar em Sair, o \"Manter conectado\" daquele navegador acaba de verdade: nem uma cópia guardada do acesso consegue entrar depois. Logo depois desta versão, quem usava \"Manter conectado\" precisa entrar com a senha uma vez."
    - "Quando um escritório é suspenso ou excluído, o \"Manter conectado\" de todas as pessoas da equipe acaba na hora, em todos os navegadores."
    - "Saiu do sistema uma busca antiga de justificativas de ponto que não separava os escritórios. Ela não era usada por nenhuma tela, e assim não pode ser usada por engano no futuro."
- versao: "2.37.1"
  data: "2026-11-05"
  itens:
    - "O aviso semanal da Controladoria gravado no Registro da pasta não cita mais o número de pastas trancadas com cadeado. O painel da Controladoria continua mostrando a cada pessoa as pastas repetidas que ela pode ver."
    - "Quem não pode abrir uma pasta trancada pelo cadeado também não vê mais, no Push Processual, os processos e as publicações dela. Ficam fora o texto da intimação, as partes e o processo no Relatório da aba Processos da OAB."
    - "Essa pessoa também não consegue mais mudar o prazo dessas publicações, marcar o prazo como cumprido, ligar ou desligar o acompanhamento do processo nem gravar anotações nele."
    - "Quem está fora do cadeado de uma pasta não vê mais essa pasta no relatório de pastas paradas, nem as metas dela na aba Tarefas do processo, e não consegue vincular a outra pasta um processo que só existe nas pastas trancadas."
    - "Quem não pode abrir uma pasta não lê mais, no relatório do Dashboard, o começo do texto dos registros dela, e não abre as metas dela pelo número, a menos que seja responsável ou criador da meta."
    - "A busca de clientes e de processos dentro da pasta fica só para quem pode editar a pasta, que é quem pode vincular."
    - "O aviso mensal das pastas paradas não mostra mais a quem está fora do cadeado de uma pasta o número, o cliente, o responsável nem a contagem dessa pasta."
    - "O aviso do relatório de pastas sem processo também não conta nem mostra o número de uma pasta para quem está fora do cadeado dela."
    - "Em Minhas Metas, quem só acompanha uma meta de uma pasta que não pode abrir deixa de ver essa meta e de contá-la. Quem é responsável pela meta ou a criou continua vendo normalmente."
    - "Os marcadores de uma pasta agora só podem ser trocados por quem tem permissão de editar essa pasta. Quem só pode ver a pasta continua vendo os marcadores, mas não vê mais o botão de trocar."
    - "Na agenda, um compromisso marcado como \"Só eu\" fica visível apenas para quem o criou, inclusive pelos links antigos. Uma reunião com convidados só abre para quem a criou e para os convidados. Os botões de editar, cancelar e excluir aparecem só para quem pode usá-los."
    - "Correção de segurança na tela do Expediente: um link preparado por outra pessoa não consegue mais fazer o sistema enviar dados para outro lugar quando você cria uma pasta a partir do Push Processual. O uso normal continua igual."
    - "Reforço interno de segurança: senhas de teste deixaram de aparecer na documentação do sistema e o banco do ambiente de desenvolvimento só aceita conexões da própria máquina."
    - "Histórico de alterações: mudanças nos dados de um escritório e nos vínculos de usuário passam a aparecer só no histórico do próprio escritório, mesmo quando feitas por quem atende mais de um escritório."
    - "Service Desk: o comentário marcado como interno pela equipe de TI não aparece mais para quem abriu o chamado."
    - "Dados do escritório (nome, CNPJ, endereço) só podem ser alterados pelo usuário primário, também na tela antiga de edição. Os demais veem esses dados, sem poder alterar, e seguem cuidando de cargos e lotações."
    - "Histórico de alterações: o botão de desfazer não alcança mais cadastro de outro escritório."
    - "Troca de senha de um colaborador pelo gestor fica bloqueada também quando a pessoa tem convite de outro escritório ou acesso a uma demanda de outro escritório no Trabalho Externo."
    - "Na ficha do cliente, cada pessoa da equipe passa a ver só as pastas que ela pode abrir, como já acontecia na janela \"Detalhes do cliente\"."
    - "Quando alguém sem acesso tenta abrir um cliente, o pedido de acesso não mostra mais o nome dele, só o número do cadastro."
    - "Para vincular um cliente a uma pasta, a pessoa precisa poder ver esse cliente. Quem não pode não recebe mais o CPF ou CNPJ dele."
    - "O aviso \"já existe uma pasta parecida\" não cita mais pastas que estão ocultas para quem está criando a pasta nova."
    - "A média do valor da causa por cliente passa a contar só as pastas que a pessoa pode ver."
    - "Quem tem a aba Financeiro oculta numa pasta não recebe mais a média do cliente ao trocar ou vincular clientes nessa pasta."
    - "O aviso de arquivo repetido no upload não mostra mais documentos de abas ocultas para a pessoa."
    - "As telas de avisos ao cliente, monitoramento do Push e Modelos passam a respeitar a aba oculta, como as outras partes da pasta."
    - "Quem deixa o BlueJus aberto e se afasta continua protegido: depois do tempo de inatividade, a sessão acaba de verdade, mesmo que alguém abra a tela de entrada ou crie no navegador um cookie de \"manter conectado\". Quem marcou \"Manter conectado\" ao entrar continua conectado. Logo depois desta versão, quem já estava assim pode ver uma vez o aviso de sessão expirada, e o BlueJus o reconecta sozinho."
    - "A troca de senha pelo código de 6 números ficou mais difícil de adivinhar: depois de muitas tentativas erradas na mesma conta, a troca por código fica fechada por um tempo e a dona da conta recebe um e-mail avisando. A senha atual continua valendo, e a pessoa entra com ela normalmente."
    - "Excluir o escritório continua pelo pedido no Meu Perfil, decidido pelo Master. Um caminho antigo, que não aparecia em nenhuma tela, deixou de aceitar quem não é o Master."
    - "Nas telas de equipe e ponto do escritório, quem é de outro escritório não consegue mais descobrir quais pessoas fazem parte do seu escritório."
    - "O Trabalho Externo segue funcionando para os convidados sem escritório, agora com uma proteção a mais contra erros futuros no sistema."
    - "Reforço de segurança interno: a verificação automática que impede senhas e chaves de entrarem no código passou a reconhecer mais tipos de credencial (como a do gateway de pagamento e a do armazenamento de arquivos), e a criação de contas administrativas exige senha forte."
    - "Correções de segurança: nomes e textos digitados (clientes, marcadores, peças, currículos) não conseguem mais rodar código escondido nas telas do sistema."
    - "As bibliotecas que montam as telas passam a vir do próprio BlueJus, e não de sites de terceiros. O visual e o uso continuam iguais."
    - "Na auditoria, só quem usa a agenda e enxerga o compromisso pode desfazer uma alteração nele. Um administrador que não foi convidado para uma reunião não consegue mais desfazer mudanças dela pelo histórico."
    - "Reforço de segurança no ambiente de desenvolvimento: o painel técnico de diagnóstico só abre no próprio computador do desenvolvedor, e não para outras máquinas da rede."
    - "Reforço de segurança interno: as senhas usadas nos testes automáticos do sistema deixaram de ficar escritas no código."
    - "O aviso de desempenho que as telas mandam ao servidor segue limitado a 60 por minuto por pessoa; a conferência automática desse limite ficou estável."
    - "Ao copiar dados para o ambiente de desenvolvimento, as senhas dos usuários de produção não ficam mais nele: todas são trocadas por uma senha só de desenvolvimento. Assim, uma cópia de trabalho perdida ou exposta não revela as senhas de quem usa o BlueJus."
    - "Na aba Processos da OAB do Push Processual, só quem pode editar a pasta do processo consegue parar de acompanhá-lo. Quem só pode visualizar a pasta recebe um aviso dizendo qual pasta impede a pausa, e o processo continua sendo acompanhado."
    - "Na aba Processos da OAB do Push Processual, só quem pode editar a pasta de um processo consegue voltar a acompanhá-lo. Quem só pode visualizar a pasta recebe um aviso dizendo qual pasta impede, e o processo continua pausado. Cadastrar um processo novo funciona como antes."
- versao: "2.37.0"
  data: "2026-11-04"
  itens:
    - "Quem já tem o acervo no Google Drive pode conectar sem medo de pastas em dobro: ao conectar, o BlueJus procura as pastas que já estão no Drive e liga cada uma à pasta do escritório de mesmo nome, junto com os documentos que já estão lá."
    - "Quando o BlueJus não tem certeza de qual pasta é qual, ele pergunta na tela \"Conectar meu Drive\": você escolhe a pasta certa ou manda ignorar. Até você decidir, ele não cria pasta nova no Drive para aquele caso."
    - "Enquanto o sistema reconhece as pastas do Drive, nenhuma pasta nova é criada lá. Se o reconhecimento não terminar, a tela do Drive avisa e mostra o botão para tentar de novo."
    - "Agora dá para trazer uma pasta do Google Drive do escritório direto para o BlueJus: em Nova Pasta, clique em \"Importar do Google Drive\" e cole o link da pasta. Tudo funciona como no Importar em lote do computador: cada subpasta vira uma pasta, a organização das subpastas vem junto e Documentos, Planilhas e Apresentações do Google entram como Word, Excel e PDF."
    - "A pasta importada continua ligada à pasta do Drive: o envio automático guarda os documentos nela, sem criar outra pasta nem trocar o nome que ela tem no Drive."
    - "Ao importar pastas em lote, quando a pasta escolhida tem subpastas, o BlueJus agora sempre pergunta: criar uma pasta para cada subpasta, ou uma pasta só com tudo. Assim a pasta de um cliente organizada em \"Documentos\" e \"Processo\" não vira mais dois clientes por engano."
    - "Ao importar pastas em lote, a organização do seu computador vem junto: se a pasta do cliente tem \"Processo\" e, dentro dela, \"Recursos\", os documentos aparecem nas mesmas subpastas dentro de Documentos, em vez de ficarem todos soltos."
    - "Na tela do ponto, quando a localização falha, o aviso agora diz o motivo certo. Se o navegador não conseguiu achar a posição ou demorou, aparece um botão \"Tentar de novo\". Se a localização ainda não foi permitida, aparece o botão \"Permitir localização\". Se ela foi bloqueada, a tela mostra o passo a passo para liberar, no computador e no celular, e volta a buscar sozinha assim que for liberada."
- versao: "2.36.0"
  data: "2026-11-04"
  itens:
    - "No Importar pastas em lote, quem tem a BlueJus IA ligada ganha o botão \"Sugerir agrupamento com IA\": a IA olha só os nomes das pastas e dos arquivos e sugere qual pasta do computador vira cada caso, com o nome do cliente. Você confere, ajusta os nomes e só então clica em Importar."
    - "A IA nunca junta casos diferentes, mesmo do mesmo cliente; no máximo avisa \"mesmo cliente que\" outra pasta. O conteúdo dos arquivos não é lido e cada clique conta como uma análise na cota do escritório."
    - "Os documentos antigos que já estão guardados na nuvem deixam de ocupar espaço duas vezes no servidor. Eles continuam abrindo normalmente pelo sistema; o primeiro acesso a um deles pode levar alguns segundos a mais."
- versao: "2.35.0"
  data: "2026-11-04"
  itens:
    - "No Painel do Master, o editor de artigos dos blogs ganhou a revisão de texto do editor da pasta: ela aponta erros de digitação, palavras repetidas e espaços duplos, e corrige com um clique (cada correção pode ser desfeita)."
    - "O mesmo editor agora localiza e substitui palavras (Ctrl+H), cria sublistas com os botões de recuo e insere símbolos como §, º e R$."
    - "No Painel do Master, o editor de artigos dos blogs ganhou o botão Inserir tabela: escolha quantas linhas e colunas, e a primeira linha já vem como cabeçalho."
    - "Com o cursor dentro da tabela, aparecem os botões para inserir ou remover linhas e colunas e para remover a tabela, iguais aos do editor da pasta."
    - "A tabela vai para o artigo publicado no blog do jeito que foi escrita."
    - "Quem ligou a \"Ampliação de GB automática\" não fica mais sem espaço: quando os arquivos passam do contratado, o espaço dobra na hora."
    - "O valor novo vale a partir da próxima cobrança, sem cobrança extra no mês, e o escritório recebe um aviso com o espaço e o valor novos."
    - "Se o pagamento não aceitar o valor novo, o espaço e o valor continuam os mesmos, a equipe do BlueJus é avisada e tentamos de novo no próximo envio."
