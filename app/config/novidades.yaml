  data: "2026-10-27"
  itens:
    - "A tela da unidade ganhou cantos mais retos, no mesmo estilo das outras telas novas."
    - "Na Agenda, os compromissos agora podem ser urgentes, pessoais ou lembretes, e o local e a descrição aparecem separados na lista."
    - "A Agenda ganhou um visual novo, com a lista do dia e o detalhe do evento ao lado do calendário, e filtros por pessoa e por situação."
    - "Agora dá para ampliar o espaço do escritório com uma assinatura mensal no cartão, sem fidelidade. O espaço sobe assim que o pagamento é confirmado e você cancela quando quiser em Meu Perfil."
    - "Quando a BlueJus liga a integração com o banco, o PIX de apoio da sua conta passa a ser confirmado sozinho, e você recebe uma mensagem de agradecimento."
    - "No painel do Master, a seção Custos importa lançamentos de um arquivo CSV e exporta todos em CSV."
    - "No painel do Master, a seção Custos permite lançar custo, excluir lançamento e copiar os lançamentos do mês anterior."
    - "No painel do Master, a seção Custos mostra o custo do mês, a receita recorrente, a margem, o custo por conta e por GB, os custos por categoria, a margem por plano com projeção de 3, 6 e 12 meses e os lançamentos do mês."
    - "No painel do Master, a seção Desempenho permite abrir e resolver incidente, registrar backup e teste de restauração e limpar os registros medidos."
    - "O sistema agora apaga sozinho, toda noite, os registros de desempenho com mais de 90 dias."
    - "Reforçamos os testes automáticos do login, para não pararem na tela de aceite dos Termos."
    - "Ao excluir uma pasta, a janela de confirmação mostra exatamente o número a digitar, que é o NUP da pasta (o que aparece no título), não o número do endereço da página."
    - "A conferência dos pagamentos PIX avisa o Master, uma vez por dia, quando a nova consulta ao banco falha em todas as cobranças."
    - "O aviso do banco e a conferência diária passam a confirmar, cancelar e expirar os pagamentos registrados. Pagamento com valor menor fica como divergente e o Master é avisado."
    - "Ao cancelar uma cobrança PIX, o sistema cancela só a cobrança certa, sem atingir outra mais nova criada em outra aba."
    - "No Trabalho Externo, com a integração com o banco conectada e a chave ligada, a aba Pagamento pede uma cobrança PIX de valor fixo, válida por 24 horas, e o banco confirma o pagamento sozinho."
    - "Na barra da pasta, ligue \"Incluir outras pastas do cliente\" para a IA cruzar as informações das pastas do mesmo cliente. Dados pessoais seguem a configuração do escritório. Pastas em segredo de justiça não são lidas."
    - "Em breve, ao abrir a conversa com o BlueJus IA com uma pasta aberta, a IA poderá responder sobre aquela pasta. Esta entrega prepara o servidor."
    - "Ao abrir uma pasta e conversar com o BlueJus IA, a barra no topo mostra qual pasta está em uso. Pergunte, por exemplo, \"Faça um resumo desta pasta\". Pastas em segredo de justiça não são lidas pela IA e a conversa avisa."
    - "Quando o chat com o BlueJus IA abrir na Central, as conversas dele ficam guardadas pelo mesmo prazo das demais respostas da IA e depois são apagadas."
    - "Quando o chat com o BlueJus IA abrir na Central, só você verá a sua conversa; ninguém do escritório vê o que você pergunta."
    - "Na Central de Comunicação (página e janela flutuante) há uma conversa fixa com o BlueJus IA. Pergunte em linguagem natural; a resposta chega na própria conversa e conta como não lida se a janela estiver fechada. A resposta é gerada por IA e pode conter erros: confira antes de usar."
    - "A análise de pastas com muitos itens deixa de falhar por resposta cortada."
    - "Quando alguém entrar na sua conta por um navegador ou rede que o BlueJus ainda não conhecia, você recebe um e-mail avisando, com o botão para trocar a senha caso não tenha sido você."
    - "Quando o Master fecha o cadastro ou o deixa só por convite, a tela de entrada deixa de oferecer \"Criar minha conta e escritório\" e avisa: \"O cadastro está disponível só por convite.\" ou \"O cadastro está fechado no momento.\" Quem já tem conta entra normalmente."
    - "Os e-mails do sistema passam a usar o nome e o e-mail de remetente definidos pelo Master nas configurações globais, e continuam chegando como antes."
    - "O Master do BlueJus pode ajustar quantas senhas erradas são aceitas antes de o login ser bloqueado por 15 minutos. Sem ajuste, continua em 5."
    - "A saudação ao entrar passa a usar o começo do seu e-mail (por exemplo, \"Bom dia, Ana!\")."
    - "Mensagens como \"Conta confirmada\" ou erro de convite, quando aparecem na tela de entrada, agora vêm destacadas em verde ou vermelho."
    - "O tempo da sessão passa a seguir a configuração do Master, com o padrão atual de 24 minutos de inatividade. Quem entrou com \"Manter conectado\" não é afetado."
    - "Ao criar uma meta, o BlueJus estima o prazo legal da providência e sugere um prazo interno com folga. É uma estimativa: confira a data e confirme antes de criar a meta."
    - "Nas pastas de cobrança judicial, o nome da pasta mostra o cliente (o credor da carteira) e não mais o devedor. No Expediente, pastas com cliente cadastrado mostram o nome desse cliente."
    - "No perfil de cada pessoa do Painel, o gestor pode marcar que vai acompanhar o trabalho dela por alguns dias e depois renovar ou encerrar. É só um lembrete de gestão: não cria nota, não muda as metas e a pessoa não é avisada."
    - "Quem não tem acesso a algumas pastas passa a ver o card \"Pastas criadas\" sem a meta do mês, para não deduzir o total do escritório. O primário continua vendo a meta e o ritmo."
    - "Na análise de desempenho de cada pessoa, o gestor vê agora como as conclusões e o tempo médio se comparam ao período anterior, uma matriz de volume e prazo, possíveis fatores e uma sugestão de plano de ação. São leituras automáticas por regras fixas, feitas para apoiar a sua conversa com a equipe, e não uma avaliação da pessoa."
    - "No Painel, o botão BlueJus Intelligence mostra, quando a meta de pastas do mês está definida, se o escritório está no ritmo para bater a meta e quantas pastas por dia útil faltam."
    - "Na Central de Inteligência, cada alerta pode ser marcado como Resolvido ou Ignorado e a recomendação pode ser avaliada com Aplicar ou Não se aplica. A marca vale só para você."
    - "No painel BlueJus Intelligence, o primário escolhe quanto o escritório quer crescer e vê a nova meta de pastas do mês, quanto cada pessoa precisa criar e os marcos por semana. Um botão aplica a nova meta."
    - "No painel de Inteligência, as perguntas sugeridas agora aparecem como botões e a resposta surge numa caixa logo abaixo. Toque de novo no botão para fechar."
    - "No Painel do Escritório, o gestor do escritório abre a análise de desempenho de cada pessoa pelo botão da estrela na linha dela. A leitura é feita por regras fixas sobre os números do período e mostra o que está acontecendo, sem classificar a pessoa nem estimar o que o sistema não registra."
    - "O gestor pode passar metas de uma pessoa para outras direto do perfil dela no Painel. Nada é movido sozinho: ele marca as metas, confere quem recebe cada uma e confirma. Quem recebe e quem entrega são avisados, e a meta guarda no histórico quem mudou o responsável."
    - "No painel de Inteligência há um controle de teste no rodapé para ver como o ritmo da meta ficaria em outro dia do mês. Nada é alterado nos seus dados."
    - "No Painel, as colunas Metas ativas, Demandas ativas, Em revisão e Pastas urgentes passam a mostrar uma seta de tendência quando já existe a foto diária de comparação. As setas só valem daqui para a frente; antes disso, ficam ocultas."
    - "O histórico dos cards Metas ativas, Demandas urgentes e Meta global começa a ser montado a partir de agora, mês a mês."
    - "Nos alertas do painel de Inteligência (Modo avançado) há o botão \"Criar tarefa\": escolha a pasta e a tarefa abre já preenchida com o texto do alerta. Revise o prazo e o responsável e crie."
    - "No Registro dos expedientes, os avisos automáticos do sistema aparecem como bolinhas. Ligue \"Marcadores do sistema\" para ver os cartões completos."
    - "No seu perfil, em \"Editar informações\", você pode informar a chave PIX onde quer receber recompensas de indicação. Ela é opcional e só você a vê."
    - "No painel do Master, quando o indicador informou a chave PIX no Meu Perfil, o Master vê essa chave e pode usá-la nos dados para pagamento da recompensa."
    - "No painel do Master, os números dos cartões da Visão geral encolhem a fonte conforme a largura do cartão, e o valor completo aparece na dica."
    - "No painel do Master, a seção Recompensas ganhou o antifraude: conta indicada do mesmo escritório, com o mesmo CNPJ ou o mesmo domínio de e-mail corporativo fica \"Em análise\" e não conta para a recompensa até o Master revisar e aprovar."
    - "No painel do Master, a seção Recompensas permite registrar o pagamento da recompensa feito fora do sistema, com forma, observação e comprovante, e o extrato mostra os pagamentos."
    - "Na tela de Peticionar, o topo ficou mais limpo e tem o botão \"Voltar à pasta\"."
    - "A tela de Peticionar ficou mais limpa. Os formatos aceitos no anexo continuam os mesmos: PDF, Word, Excel, imagens, XML e KML."
    - "No Peticionar, arraste um documento para reordenar a lista. A nova ordem vale também na aba Documentos da pasta."
    - "No Peticionar, o botão do processo abre a lista dos processos da pasta. A escolha vale só para esta tela e não grava nada."
    - "Ajustes no Push Processual para ficar igual ao desenho aprovado, com mais segurança ao parar de acompanhar processos."
    - "Na aba Processos do Push, dá para vincular o processo a uma pasta direto na lista, e os avisos ficam mais discretos."
    - "Cada usuário só mexe nas próprias publicações do Diário."
    - "A meta criada não leva o texto da publicação, só o ato e a data, por causa do sigilo."
    - "As publicações do Diário são pessoais: cada usuário vê só as que registrou."
    - "Dá para tirar de vez um processo do Push, sem ele voltar na lista de sugestões."
    - "Escolha os dias úteis do prazo conforme a intimação: o sistema conta sem fins de semana, feriados e recesso forense e mostra quantos dias faltam. Confira sempre o termo inicial na intimação."
    - "Em publicação vinculada a uma pasta, \"Criar meta com este prazo\" cria a meta na pasta, com você como responsável. Publicação avulsa não cria meta: vincule uma pasta antes."
    - "Na caixa do Push dá para marcar várias publicações e marcá-las como lidas ou excluí-las de uma vez. A exclusão pede que você digite EXCLUIR."
    - "Novo botão \"Limpar lidas\" tira da caixa tudo o que você já leu. O processo e a pasta continuam como estão."
    - "Clique com o botão direito numa publicação para abrir, marcar como lida ou não lida, copiar o número do processo ou excluir."
    - "Em cada publicação avulsa há um botão para vincular a uma pasta: busque pelo número da pasta ou pelo nome do cliente e escolha. Todas as publicações do mesmo processo passam a aparecer como vinculadas."
    - "Nas publicações vinculadas, o botão de tesoura desvincula da pasta, e o botão direito também oferece abrir a pasta e trocar a pasta vinculada."
    - "Só aparecem as pastas que você pode editar."
    - "No modal de vincular, digite o número da pasta: se ele existir, o botão \"Vincular à Pasta N\" faz o vínculo. Se a pasta ainda não existe, use \"Abrir nova pasta\": depois de criá-la, o processo é vinculado sozinho."
    - "Reforçamos os testes automáticos da baixa de recompensa do painel do Master."
    - "No painel do Master, cada indicador com saldo liberado ganha o botão \"Dar baixa\" direto na linha, ao lado de \"Ajustar\"."
    - "Nova tela \"Meus chamados\": você vê o saldo para atendimento técnico, o extrato e a lista dos seus chamados, e abre chamados de suporte ou de treinamento com a equipe técnica do BlueJus."
    - "É preciso ter pelo menos R$ 20,00 de saldo para abrir um chamado. Para adicionar saldo, escolha o valor (R$ 20, 50, 100 ou 200) e pague por PIX; o saldo é liberado quando a equipe confirma o pagamento."
    - "Pequenos acertos visuais nas telas de Trabalho Externo, para ficarem iguais ao desenho aprovado."
    - "Mais alguns acertos visuais nas telas de Trabalho Externo, para ficarem iguais ao desenho aprovado."
