- versao: "2.6.0"
  data: "2026-10-20"
  itens:
    - "Na Agenda, clique com o botão direito num dia para acrescentar um feriado municipal ou uma suspensão do tribunal, ou para ocultar uma data que não vale no seu escritório. Isso muda só a Agenda: para contar no ponto, continue cadastrando em Feriados e Folgas."
