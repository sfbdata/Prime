    - "O prazo da meta passa a mostrar o mesmo \"vence hoje\" ou \"atrasado\" em todas as telas."
    - "Dentro de uma pasta, aperte Ctrl + K para buscar outra pasta pelo número, pelo nome ou CPF do cliente ou pelo número do processo, e abrir com Enter."
    - "O usuário primário do escritório define em quanto tempo sem uso a equipe aparece como ausente no painel de presença."
- versao: "2.5.0"
  data: "2026-10-20"
  itens:
    - "A Agenda ganhou tela nova: feriados nacionais e do seu estado, recesso forense, datas comemorativas, aniversários da equipe e os prazos das pastas aparecem sozinhos no calendário."
    - "Nova tela de entrada, com recuperação de senha por código e criação da conta e do escritório em um minuto."
    - "O usuário primário agora pode trancar uma pasta para toda a equipe ou escolher, pessoa por pessoa, quem não vê, quem só visualiza e quem edita. Quem encontra a pasta trancada pode pedir acesso ao primário pela própria tela."
    - "Agora dá para criar um marcador direto na janela Marcadores da pasta: digite o nome e clique em \"Criar marcador\"."
    - "A aba Detalhes mostra quais pontos do relatório inicial já foram registrados e quais ainda faltam, e se atualiza assim que você registra uma observação."
    - "Agora dá para bater o ponto de entrada e de saída direto pelo painel de quem está on-line, no avatar do topo."
    - "Quem trabalha em mais de um escritório precisa registrar a saída num antes de registrar a entrada no outro, no mesmo dia."
    - "Na aba Push da pasta, o cartão \"Avisar cliente\" guarda os e-mails do cliente, e a análise da BlueJus IA pode ser enviada a ele por e-mail depois de revisada, sempre com cópia para a Controladoria do escritório."
    - "No cartão \"Avisar cliente\" da aba Push, o escritório pode ligar o envio automático ao cliente das novas movimentações, das audiências e intimações e de um resumo semanal toda segunda-feira, sempre com cópia para a Controladoria."
- versao: "2.4.0"
  data: "2026-10-20"
  itens:
    - "Ao escolher \"Animações reduzidas\" no Guia visual do Dashboard, o sistema inteiro fica sem animações, não só o Dashboard."
    - "Os registros antigos de Auditoria dos compromissos \"Só eu\" também deixam de mostrar o conteúdo do compromisso. Continuam mostrando a ação, quem fez e quando."
    - "Na cobrança, clique com o botão direito em uma obrigação (ou no \"⋯\") para receber, marcar, copiar o valor, ver a memória de cálculo, corrigir ou excluir."
    - "Na carteira, o aviso de \"dados atualizados até\" agora diz qual relatório importar para colocar a carteira em dia."
    - "Na carteira de cobrança, o menu \"⋮\" agora tem \"Exportar lista (.xlsx)\": baixa em planilha a lista que está na tela, com a busca e o filtro que você aplicou."
    - "Nova página Contribua, no menu do seu avatar: veja quanto espaço o escritório usa, apoie o BlueJus por PIX e mande sugestões de melhoria."
    - "No menu de cada observação da aba Detalhes, \"Enviar no Chat I.A\" abre o chat e copia o texto da observação para você colar na conversa."
    - "No Expediente, a pasta criada aparece no topo da lista, com um aviso, e o Limpar dos filtros mantém a situação escolhida."
    - "Em telas médias, a lista do Expediente mostra Cliente, Réu, Prioridade, Marcadores e Situação, com menos rolagem para o lado."
    - "No Expediente, o filtro de responsável mostra a foto de cada pessoa."
    - "Menus e janelinhas que não tinham como fechar agora têm um X no canto."
    - "O item \"Instalar aplicativo\" agora explica como instalar o BlueJus quando o navegador não oferece a instalação direta."
    - "A sugestão de documentos da pasta acompanha a fase atual do processo pelo Push, em vez de só pela classe processual."
    - "Minhas Metas ficou com o visual novo: cada grupo num cartão, a linha inteira abre a meta e a busca acha também pelo número da pasta e pelo nome do cliente."
    - "Na pasta, um aviso mostra quando dois clientes vinculados têm o mesmo CPF."
    - "Nos registros da pasta, dá para ver se quem escreveu está disponível, ocupado, ausente ou off-line."
    - "Agora o primário pode esconder abas de uma pasta (por exemplo, o Financeiro) para toda a equipe ou para pessoas escolhidas."
    - "Nada muda por enquanto: o bloqueio de envio e o limite de usuários só passam a valer quando o BlueJus ligar a chave."
    - "Telas em ajuste podem aparecer como \"em preparação\" por alguns dias, com a previsão de volta quando houver."
    - "No Peticionar, cada documento ganhou um menu (três pontos ou botão direito) para abrir, renomear, baixar, classificar e excluir. Dá para voltar à pasta pelo cabeçalho e arrastar arquivos direto para a lista."
    - "Na aba Push da pasta, o cartão \"Avisar quando chegar\" escolhe quem fica sabendo quando chega uma movimentação nova: o responsável pela pasta recebe o aviso no sino e, se quiser, por e-mail; a BlueJus IA pode já resumir as novidades."
    - "Na aba Push da pasta, um painel novo mostra se o processo está sendo monitorado, quando foi a última consulta ao diário e em que pé ele está, com o próximo ato e a data provável. Dá para pausar o monitoramento e buscar as publicações na hora."
    - "Novo relatório geral de processos: mostra quais pastas deveriam ter processo vinculado e quais precisam de revisão, com sugestões e prazos, e pode ser enviado à Controladoria."
    - "Na edição do colaborador, a nova opção \"Controladoria\" indica quem recebe esse relatório todo mês."
