server {
    listen 80;
    server_name bluejus.com.br www.bluejus.com.br;
    server_tokens off;

    # Desafio HTTP-01 do Let's Encrypt (webroot). Precisa vir antes do redirect:
    # com `return 301` no nível do server, o desafio tomaria 301 e a validação falharia.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bluejus.com.br www.bluejus.com.br;
    server_tokens off;
    client_max_body_size 70m;
    root /var/www/app/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/bluejus.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bluejus.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Modo manutenção: se a flag existir, serve a página amigável sem tocar no PHP.
    # (teste de existência de arquivo — uso seguro/canônico de `if` no contexto server)
    # O `if` curto-circuita no nível do server, antes de qualquer location, então
    # cobre 100% da janela de deploy: nenhuma requisição chega no fastcgi enquanto a
    # flag existe. Por isso só interceptamos o 503 da flag — 502/504 reais (crashes
    # fora de deploy) seguem com o comportamento padrão, sem mascarar incidente.
    if (-f /var/www/maintenance/maintenance.on) {
        return 503;
    }
    error_page 503 @manutencao;
    location @manutencao {
        root /var/www/maintenance;
        rewrite ^ /maintenance.html break;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Rotas de upload servidas pelo PHP (não interceptar como arquivo estático)
    location ^~ /perfil/foto/ {
        try_files $uri /index.php$is_args$args;
    }
    # C5 (defesa-em-profundidade): /uploads/ NUNCA é servido como arquivo estático.
    # ATENÇÃO: `try_files $uri ...` servia o arquivo se ele EXISTISSE (só caía no PHP
    # quando ausente) — ou seja, qualquer arquivo em public/uploads/ era baixável sem
    # auth. Com `rewrite ^ /index.php last` tudo vai ao front controller (rota
    # controlada com auth/tenant, ou 404). O firewall (^/ ROLE_USER) exige login.
    location ^~ /uploads/ {
        rewrite ^ /index.php last;
    }

    # Código (CSS/JS): a URL NÃO é versionada (asset('js/x.js') sai como /js/x.js) e o
    # conteúdo muda a cada deploy, então `immutable` mentiria — o browser reteria a versão
    # velha por 30d sem nem revalidar. `no-cache` = cacheia mas confirma via ETag antes de
    # usar: 304 minúsculo quando nada mudou, arquivo novo quando mudou. Deploy chega na hora.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Binários (imagens/fontes): praticamente não mudam; cache longo é seguro e poupa
    # requisições. Se um dia forem versionados por nome, `immutable` continua válido.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }
}

# ===========================================================================
# ATENÇÃO: os 2 blocks abaixo (grupojusprime.tech) NÃO servem o JusPrime.
# Servem outro sistema co-hospedado (gestão de condomínio), externo a este
# projeto.
#
# Upstream: container condominio_app:8000, que roda na rede PRÓPRIA do
# condomínio (condominio_condominio_net) — NÃO na jusprime_saas_net.
# O jusprime_nginx_prod alcança esse container porque o deploy-prod-tls.sh o
# conecta a essa rede via `docker network connect` após cada recreate.
#
# A resolução do upstream é DINÂMICA (resolver 127.0.0.11), feita no request e
# não no boot: se o condomínio estiver fora, este block devolve 502 ISOLADO —
# não derruba o nginx nem afeta o bluejus.com.br.
#
# NÃO alterar nem remover em manutenções do jurídico.
# Cert reutilizado de /etc/letsencrypt/live/grupojusprime.tech/.
# ===========================================================================
server {
    listen 80;
    server_name grupojusprime.tech www.grupojusprime.tech;
    server_tokens off;

    # Desafio HTTP-01 do Let's Encrypt (webroot) — mínimo necessário p/ renovar este
    # cert. O redirect vai para `location /` para não interceptar o acme-challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name grupojusprime.tech www.grupojusprime.tech;
    server_tokens off;
    client_max_body_size 14M;

    ssl_certificate     /etc/letsencrypt/live/grupojusprime.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grupojusprime.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = / {
        return 301 /app/;
    }
    location / {
        resolver 127.0.0.11 valid=10s;
        set $cond_upstream http://condominio_app:8000;
        proxy_pass $cond_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
